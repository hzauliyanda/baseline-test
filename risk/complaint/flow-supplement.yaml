name: risk-complaint-supplement
desc: 外部投诉工单【补充】负向分支：状态门违反（编辑/备注/下发的状态校验）+ 创建校验 + handler/refresh。主链路见 flow.yaml。
base_url: https://test-risk.inshopline.com

variables:
  cookie: "{{ENV:RISK_COOKIE}}"
  issue_config_id: "186"

steps:
  # ===== 基础只读接口 =====
  - id: handler
    desc: "GET /complaints/user/handler 处理人（返回首个有效配置的固定接收人）"
    request: { method: GET, url: "{{base_url}}/mapi/cs/issue/complaints/user/handler", headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" } }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: refresh
    desc: "PUT /complaints/refresh 刷新（全量更新，维护型，无权限门）"
    request: { method: PUT, url: "{{base_url}}/mapi/cs/issue/complaints/refresh", headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" } }
    assert: { status: 200 }

  # ===== 创建校验负向 =====
  - id: create_missing_config
    desc: "负向：创建缺 issueConfigId → binding required（INVALID_ARGUMENT）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/complaints"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueName: "[FLOW]noconfig", riskType: "假冒", complaintSource: "Other" }
    assert: { status: 200 }

  - id: create_bad_source
    desc: "边界：complaintSource=XYZ（非法值）→ handler 不校验，原样落库（验证前端约束是否足够）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/complaints"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueConfigId: "{{issue_config_id}}", issueConfigName: "外部投诉工单", issueName: "[FLOW]badsrc_{{run_id}}", riskType: "假冒", complaintSource: "XYZ" }
    extract: { bad_src_id: "$.data" }
    assert: { status: 200 }

  - id: cleanup_bad_src
    desc: "清理 bad_source 工单"
    request: { method: DELETE, url: "{{base_url}}/mapi/cs/issue/base/{{bad_src_id}}", headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" } }
    assert: { status: 200 }

  # ===== 状态门负向（一个工单流转验证）=====
  - id: setup_create
    desc: "建状态门测试工单（→5待下发）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/complaints"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueConfigId: "{{issue_config_id}}", issueConfigName: "外部投诉工单", issueName: "[FLOW]statetest_{{run_id}}", riskType: "假冒", complaintSource: "Other" }
    extract: { st_id: "$.data" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: deliver_to_6
    desc: "下发（5→6标注中）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/deliver"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{st_id}}", markDeadline: 1893456000000, notifyRecipientIdList: ["84", "75"], remark: "状态门测试" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: edit_status6_fail
    desc: "负向：状态6编辑 → only to be deliver issue can edit"
    request:
      method: PUT
      url: "{{base_url}}/mapi/cs/issue/complaints/{{st_id}}"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueName: "[FLOW]should_fail" }
    assert: { status: 200 }

  - id: remark_status6_ok
    desc: "正向：状态6备注 → SUCCESS（FollowRemark 更新）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/complaints/remark"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{st_id}}", remark: "状态6可备注" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: not_deliver_to_11
    desc: "无需下发（6→11）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/not-deliver"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{st_id}}" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: remark_status11_fail
    desc: "负向：状态11备注 → ISSUE_STATUS_ERR（仅状态6可备注）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/complaints/remark"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{st_id}}", remark: "应失败" }
    assert: { status: 200 }

  - id: deliver_status11_fail
    desc: "负向：状态11下发 → ISSUE_STATUS_ERR（仅状态5/6可下发）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/deliver"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{st_id}}", markDeadline: 1893456000000, notifyRecipientIdList: ["84"], remark: "应失败" }
    assert: { status: 200 }

  - id: time_only_one_fail
    desc: "负向：列表只传 createdStartTime 不传 endTime → 英文 error + InvalidArgument"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/complaints/pageable"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { pageNum: 1, pageSize: 10, createdStartTime: 1700000000000 }
    assert: { status: 200 }

  - id: cleanup_state_test
    desc: "清理状态门测试工单"
    request: { method: DELETE, url: "{{base_url}}/mapi/cs/issue/base/{{st_id}}", headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" } }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }
