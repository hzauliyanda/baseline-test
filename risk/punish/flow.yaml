name: risk-punish-crud
desc: 处罚/预警工单(punish, SubIssueType=OTHER)主链路：创建(含处罚主体)→基本信息→列表→编辑→下发→店铺列表→无需下发→删除。真实数据 storeId=1113/riskType=EMAIL_ERROR。
base_url: https://test-risk.inshopline.com

variables:
  cookie: "{{ENV:RISK_COOKIE}}"
  store_id: "1113"                    # 真实店铺ID（爬 store/list 所得）
  risk_type: "EMAIL_ERROR"

steps:
  # 1. 创建（含处罚主体 riskInfoList，→状态5）
  - id: create
    desc: "POST /punish/add 创建（riskInfoList store+riskValue=storeId）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/add"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueName: "[FLOW]punish_{{run_id}}"
        issueDesc: "自动化测试"
        riskInfoList:
          - { subjectType: "store", fieldInputType: "TEXT", riskValue: "{{store_id}}", riskType: "{{risk_type}}", riskTypeName: "" }
    extract:
      issue_id: "$.data"
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }, { path: "$.data", exists: true }] }

  # 2. 基本信息（取字符串 issueId + 验证状态5/storeCount）
  - id: baseInfo
    desc: "GET /punish/baseInfo/:id（状态5，storeCount=1）"
    request: { method: GET, url: "{{base_url}}/mapi/cs/issue/punish/baseInfo/{{issue_id}}", headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" } }
    extract: { issue_id: "$.data.issueId" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }, { path: "$.data.issueStatus", exists: true }] }

  # 3. 列表
  - id: list
    desc: "POST /punish/list（subType=OTHER 预警工单）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/list"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { subType: "OTHER", createUserId: "253", pageNum: 1, pageSize: 5 }
    extract: { issue_id: "$.data.list[0].issueId" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  # 4. 编辑（仅状态5）
  - id: edit
    desc: "PUT /punish/:id 编辑（状态5时可改名称）"
    request:
      method: PUT
      url: "{{base_url}}/mapi/cs/issue/punish/{{issue_id}}"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueName: "[FLOW]punish_edit_{{run_id}}", issueDesc: "编辑后" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  # 5. 下发（5→6标注中）
  - id: deliver
    desc: "POST /punish/deliver 下发（5→6，写 MarkDeadline/通知人，发企微+邮件）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/deliver"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{issue_id}}", markDeadline: 1893456000000, remark: "自动化下发" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  # 6. 店铺列表（处罚主体）
  - id: store_list
    desc: "POST /punish/store/list 店铺处罚列表"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/store/list"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{issue_id}}", pageNum: 1, pageSize: 10 }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  # 7. 无需下发（6→11）
  - id: not_deliver
    desc: "POST /punish/not-deliver 无需下发（6→11）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/not-deliver"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{issue_id}}" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  # 8. 删除（清理）
  - id: delete
    desc: "DELETE /issue/base/:id 删除工单（清理）"
    request: { method: DELETE, url: "{{base_url}}/mapi/cs/issue/base/{{issue_id}}", headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" } }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }
