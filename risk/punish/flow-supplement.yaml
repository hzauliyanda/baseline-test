name: risk-punish-supplement
desc: 处罚工单【补充】负向分支（状态门）+ 补充接口（subject/info/delay/mark/product/business/批量）。主链路见 flow.yaml。
base_url: https://test-risk.inshopline.com

variables:
  cookie: "{{ENV:RISK_COOKIE}}"
  store_id: "1113"
  risk_type: "EMAIL_ERROR"

steps:
  # ===== 补充只读接口（用现有工单 223，只读安全）=====
  - id: product_list
    desc: "POST /punish/product/list 商品处罚列表（用现有工单223）"
    request: { method: POST, url: "{{base_url}}/mapi/cs/issue/punish/product/list", headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }, json: { issueId: "223", pageNum: 1, pageSize: 5 } }
    assert: { status: 200 }

  - id: business_associate
    desc: "GET /punish/business/associate/223/store 业务负责人"
    request: { method: GET, url: "{{base_url}}/mapi/cs/issue/punish/business/associate/223/store", headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" } }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: list_time_only_one
    desc: "负向：列表 beginTime/endTime 只传一个 → 必须成对传"
    request: { method: POST, url: "{{base_url}}/mapi/cs/issue/punish/list", headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }, json: { subType: "OTHER", pageNum: 1, pageSize: 10, beginTime: 1700000000000 } }
    assert: { status: 200 }

  # ===== 状态门负向（一个工单流转）=====
  - id: setup_create
    desc: "建状态门测试工单（→5）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/add"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueName: "[FLOW]punish_st_{{run_id}}", riskInfoList: [{ subjectType: "store", fieldInputType: "TEXT", riskValue: "{{store_id}}", riskType: "{{risk_type}}", riskTypeName: "" }] }
    extract: { st_id: "$.data" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: st_list_id
    desc: "list 查回字符串 issueId（deliver/store_list body 要 string）"
    request: { method: POST, url: "{{base_url}}/mapi/cs/issue/punish/list", headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }, json: { subType: "OTHER", createUserId: "253", pageNum: 1, pageSize: 5 } }
    extract: { st_id: "$.data.list[0].issueId" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: subject_info_5_fail
    desc: "负向：状态5查处罚主体 → PENDING_CANNOT_PUNISH（待下发不能处罚）"
    request: { method: GET, url: "{{base_url}}/mapi/cs/issue/punish/subject/info?issueId={{st_id}}&punishSubjectType=store", headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" } }
    assert: { status: 200 }

  - id: st_edit_5_ok
    desc: "正向：状态5编辑 → SUCCESS"
    request: { method: PUT, url: "{{base_url}}/mapi/cs/issue/punish/{{st_id}}", headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }, json: { issueName: "[FLOW]st_edited" } }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: st_deliver
    desc: "下发（5→6）"
    request: { method: POST, url: "{{base_url}}/mapi/cs/issue/punish/deliver", headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }, json: { issueId: "{{st_id}}", markDeadline: 1893456000000, remark: "状态门" } }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: st_edit_6_fail
    desc: "负向：状态6编辑 → ISSUE_STATUS_ERR（仅状态5可编辑）"
    request: { method: PUT, url: "{{base_url}}/mapi/cs/issue/punish/{{st_id}}", headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }, json: { issueName: "[FLOW]should_fail" } }
    assert: { status: 200 }

  - id: st_store_list
    desc: "店铺列表（取 punishId 供 delay）"
    request: { method: POST, url: "{{base_url}}/mapi/cs/issue/punish/store/list", headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }, json: { issueId: "{{st_id}}", pageNum: 1, pageSize: 5 } }
    extract: { punish_id: "$.data.list[0].punishId" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: st_delay
    desc: "暂缓（状态6写 MarkRecord 标注记录）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/delay"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { isDelay: 1, delayReason: "WHITE_LIST_MERCHANT", punishIdList: ["{{punish_id}}"], delayRemark: "白名单商家暂缓" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: delay_remark_too_long
    desc: "负向：delayRemark 超50字符 → 暂缓原因不能超过50个字符"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/punish/delay"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { isDelay: 1, delayReason: "ON_APPEAL", punishIdList: ["{{punish_id}}"], delayRemark: "这是一段超过五十个字符的暂缓备注用于验证长度限制校验是否生效测试用一二三四五六七八九十" }
    assert: { status: 200 }

  - id: st_mark_list
    desc: "标注记录（暂缓写入的 MarkRecord）"
    request: { method: POST, url: "{{base_url}}/mapi/cs/issue/punish/mark/list", headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }, json: { issueId: "{{st_id}}", pageNum: 1, pageSize: 5 } }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: st_remark_6_fail
    desc: "负向：状态6风控备注 → ISSUE_STATUS_ERR（remark 仅状态7标注完结可改）"
    request: { method: POST, url: "{{base_url}}/mapi/cs/issue/punish/remark", headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }, json: { punishId: "{{punish_id}}", remark: "应失败" } }
    assert: { status: 200 }

  - id: st_batch_not_deliver_6_fail
    desc: "负向：状态6批量无需下发 → ISSUE_STATUS_ERR（batch/not-deliver 仅状态5整批）"
    request: { method: POST, url: "{{base_url}}/mapi/cs/issue/punish/batch/not-deliver", headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }, json: { issueIds: ["{{st_id}}"] } }
    assert: { status: 200 }

  - id: cleanup_st
    desc: "清理状态门测试工单"
    request: { method: DELETE, url: "{{base_url}}/mapi/cs/issue/base/{{st_id}}", headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" } }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }
