name: risk-threathunter-query
base_url: https://test-risk.inshopline.com

# 鉴权：本系统用 Cookie session（armorSession 等）+ 固定头 appId/version，无 Bearer token。
# 执行前用 --set cookie="<从浏览器复制的完整 Cookie>" 覆盖，或设环境变量 COOKIE。
variables:
  cookie: "{{ENV:COOKIE}}"
  app_id: "4"
  # 入库日期区间（epoch 毫秒）。跨环境/跨时间会变，参数化；默认示例为近 7 天窗口。
  start_create_time: 1784649600000
  end_create_time: 1785340799999

steps:
  # ========== Tab 1：全量情报 ==========
  - id: threat_init
    desc: 进入页面/全量情报初始化（加载枚举等）
    request:
      method: GET
      url: "{{base_url}}/mapi/analysis/threat/init"
      headers:
        appId: "{{app_id}}"
        version: v2
        Accept: application/json
        Cookie: "{{cookie}}"
    assert:
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }

  - id: threat_query
    desc: 全量情报 Tab 点「查询」（可带 username/hostname/domain/isRisk 筛选）
    request:
      method: POST
      url: "{{base_url}}/mapi/analysis/threat/pages"
      headers:
        appId: "{{app_id}}"
        version: v2
        Content-Type: application/json;charset=UTF-8
        Accept: application/json
        Cookie: "{{cookie}}"
      json:
        pageNum: 1
        pageSize: 20
        startCreateTime: "{{start_create_time}}"
        endCreateTime: "{{end_create_time}}"
        # 以下筛选可选，按需放开：
        # username: "test@shopline.com"
        # hostname: "testhost"
        # domain: "example.com"
        # isRisk: true          # 是=true / 否=false
    assert:
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }
        - { path: "$.data.pageNum", exists: true }

  # ========== Tab 2：定向域名情报 ==========
  - id: privilege_init
    desc: 切到定向域名情报 Tab / 初始化（返回 businessParties 域名枚举）
    request:
      method: GET
      url: "{{base_url}}/mapi/analysis/privilege-account/init"
      headers:
        appId: "{{app_id}}"
        version: v2
        Accept: application/json
        Cookie: "{{cookie}}"
    assert:
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }
        - { path: "$.data.businessParties", exists: true }

  - id: privilege_query
    desc: 定向域名情报 Tab 点「查询」（可带 domain/userType/verifyStatus/url/emailDomain 筛选）
    request:
      method: POST
      url: "{{base_url}}/mapi/analysis/privilege-account/pages"
      headers:
        appId: "{{app_id}}"
        version: v2
        Content-Type: application/json;charset=UTF-8
        Accept: application/json
        Cookie: "{{cookie}}"
      json:
        pageNum: 1
        pageSize: 20
        isTargetDomain: true
        startCreateTime: "{{start_create_time}}"
        endCreateTime: "{{end_create_time}}"
        # 以下筛选可选，按需放开：
        # username: "test@shopline.com"
        # domain: "zoom.us"          # 取值见 privilege_init 返回的 businessParties
        # userType: 2                # 用户=2（未知/员工/用户）
        # verifyStatus: 1            # 已验证=1 / 未验证=0
        # url: "https://sso.shoplineapp.com"
        # emailDomain: "shopline.com"
    assert:
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }
        - { path: "$.data.pageNum", exists: true }

# ========== 缺口（未抓包，未实操） ==========
# 以下为写操作/影响性动作，探索时按安全护栏未执行，接口未抓到，需要时补录：
#   - 全量情报：批量验证账密 / 批量标记风险 / 批量加入黑名单
#   - 定向域名情报：行「验证账密」 / 批量验证账密
# 这些动作会对真实泄露账号发起账密验证或写风险标记/黑名单，属 denylist，切勿在探索中触发。
