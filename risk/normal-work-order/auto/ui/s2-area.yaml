name: "S2-area-运营地区联动"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-111"]
frontend_branch: "F-03"
note: |
  覆盖「有 operateAreaList 的模板：选模板→出运营地区下拉→选区→第二层审批人按区匹配」分支。
  模板：「shenhuanhuan测试」(issueConfigId=496, subIssueType=MERCHANT_ONBOARDING)
    operateAreaList=["CN","ID","HK","AU"]
  在新建弹窗中：工单类型选「商家入驻」→ 工单模板选「shenhuanhuan测试」→ 运营地区选「CN」

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S2a-01: 导航到列表页"

  - action: click
    description: "S2a-02: 点击「新建工单」按钮"

  - action: click
    description: "S2a-03: 工单类型 Radio 选「商家入驻」（对应 MERCHANT_ONBOARDING）"

  - action: select
    description: "S2a-04: 工单模板下拉（mousedown 触发）选「shenhuanhuan测试」(issueConfigId=496)"
    value: "shenhuanhuan测试"

  - action: assert
    description: "TC-NWO-111-step1: 弹窗出现第三个表单项「运营地区」Select（operateAreaList=CN/ID/HK/AU），且第二层表单未展示（showSecondLevel=false，因 operationArea 未选）"

  - action: select
    description: "S2a-05: 在「运营地区」Select 中选择「CN」（mousedown 触发）"
    value: "CN"

  - action: assert
    description: "TC-NWO-111-step2: 第二层表单展开（showSecondLevel=true），「1级审批人」区域展示 CN 对应 approvalConfig 的审批人（approvalConfigs.find 按 operateAreaList 匹配 CN 的那条生效，而非默认 index=0）"

  - action: click
    description: "S2a-06: 弹窗右上角关闭（不提交），结束本场景"

human_verify:
  - id: HV-S2a-01
    tc_ids: ["TC-NWO-111"]
    method: screenshot
    description: "截图验证两层弹窗联动效果"
    what_to_check: |
      截图1（S2a-04 后）：第一层弹窗出现「运营地区」Select，第二层未展示（弹窗宽度仍为 600px）；
      截图2（S2a-05 后）：弹窗变宽（1180px），第二层展开，「1级审批人」区域填充了 CN 地区对应的审批人配置；
      对比两张截图确认联动触发
