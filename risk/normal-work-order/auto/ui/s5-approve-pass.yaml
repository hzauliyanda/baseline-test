name: "S5-审批通过"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-030","TC-NWO-034"]
depends_on: ["S2"]

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S5-01: 导航到名单申请列表页"

  - action: click
    description: "S5-02: 点击 S2 创建的 [FLOW] 工单行的「查看」进入详情(当前用户 liyanda 为 1级审批人)"

  - action: assert
    description: "S5-03: 详情展示「通过/驳回」按钮与备注(approveDesc)输入框"

  - action: input
    description: "S5-04: 在审批备注框(#approveDesc)输入「UI自动化审批通过」(真实键盘输入)"
    value: "UI自动化审批通过"

  - action: click
    description: "S5-05: 点击「通过」按钮"

  - action: assert
    description: "S5-06: 审批成功(POST /mapi/cs/issue/normal/approve, approveStatus=SUCCESS)；单级审批模板状态由 待审批→已完结；审核进程新增「已通过」含备注"

human_verify:
  - id: HV-S5-01
    tc_ids: ["TC-NWO-030"]
    method: screenshot
    description: "截图验证审批通过后页面状态"
    what_to_check: "截图：详情页右侧进程时间线底部新增「1级审批」节点，显示操作人 liyanda、备注「UI自动化审批通过」、状态 SUCCESS；「通过/驳回」按钮不再显示"

  - id: HV-S5-02
    tc_ids: ["TC-NWO-034"]
    method: sql
    description: "SQL 验证工单状态变更"
    sql: |
      SELECT issue_id, issue_status, current_approve_step_status
      FROM t_cs_issue
      WHERE issue_name = '[FLOW]UI自动化_新建单'
      ORDER BY created_at DESC LIMIT 1;
    expected: "issue_status='FINISH'（已完结），current_approve_step_status='SUCCESS'"
