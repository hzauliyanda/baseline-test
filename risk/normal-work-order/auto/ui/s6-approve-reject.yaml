name: "S6-审批驳回"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-031"]
depends_on: ["S2"]
provides: "一条已驳回的 [FLOW] 工单，供 S7 删除清理"

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S6-01: 导航到名单申请列表页"

  # 先新建一条待审批单供驳回（复用 S2 的创建步骤要点）
  - action: click
    description: "S6-02: 点击「新建工单」打开弹窗"

  - action: click
    description: "S6-03: 工单类型选「其他」，工单模板选「测试工单类型-一级审批」"

  - action: input
    description: "S6-04: 弹窗内「工单名称」填 [FLOW]UI自动化_驳回单(.ant-modal 作用域定位 + 真实键盘输入)"
    value: "[FLOW]UI自动化_驳回单"

  - action: input
    description: "S6-05: 「店铺Handle」填 flow-reject-handle 后回车确认"
    value: "flow-reject-handle"

  - action: click
    description: "S6-06: 点「完成」提交，弹窗关闭"

  - action: click
    description: "S6-07: 在新建的 [FLOW] 驳回单行点「查看」进入详情"

  - action: input
    description: "S6-08: 审批备注(#approveDesc)填「UI自动化驳回」(真实键盘输入)"
    value: "UI自动化驳回"

  - action: click
    description: "S6-09: 点击「驳回」按钮"

  - action: assert
    description: "S6-10: 驳回成功(POST /mapi/cs/issue/normal/approve, approveStatus=REJECT)；状态由 待审批→已驳回；审核进程新增「已驳回」记录"

human_verify:
  - id: HV-S6-01
    tc_ids: ["TC-NWO-031"]
    method: screenshot
    description: "截图验证驳回后状态与操作按钮"
    what_to_check: "截图：右侧进程时间线新增「已驳回」节点含备注「UI自动化驳回」；底部出现「取消」和「重新提交」按钮（isCreator=true 且 issueStatus=reject）；「通过/驳回」按钮消失"

  - id: HV-S6-02
    tc_ids: ["TC-NWO-031"]
    method: sql
    description: "SQL 验证驳回状态写库"
    sql: |
      SELECT issue_id, issue_status, current_approve_step_status
      FROM t_cs_issue
      WHERE issue_name = '[FLOW]UI自动化_驳回单'
      ORDER BY created_at DESC LIMIT 1;
    expected: "issue_status='REJECT'（已驳回），current_approve_step_status='REJECT'"
