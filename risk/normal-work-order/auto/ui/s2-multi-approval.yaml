name: "S2-multi-approval-多人审批人禁用"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-112"]
frontend_branch: "F-05"
note: |
  覆盖「MULTI 类型且审批人数>1 时，审批人 Select disabled 不可更改」分支。
  模板：「测试工单类型-一级多人审批」(issueConfigId=28, subIssueType=OTHER)
    approvalConfig: step=1, type=MULTI, approvalList=[liyanda, lujiabao]（2人）
  在新建弹窗中：工单类型选「其他」→ 工单模板选「测试工单类型-一级多人审批」

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S2m-01: 导航到列表页"

  - action: click
    description: "S2m-02: 点击「新建工单」按钮"

  - action: click
    description: "S2m-03: 工单类型 Radio 选「其他」（默认已是其他，确认选中）"

  - action: select
    description: "S2m-04: 工单模板下拉（mousedown 触发）选「测试工单类型-一级多人审批」(issueConfigId=28)"
    value: "测试工单类型-一级多人审批"

  - action: assert
    description: "TC-NWO-112: 第二层弹窗「1级审批人」Select 处于 disabled 状态（item.type===MULTI && approvalList.length>1，add-normal-order.tsx:575），已预填 liyanda、lujiabao 两名审批人，点击 Select 无法展开下拉"

human_verify:
  - id: HV-S2m-01
    tc_ids: ["TC-NWO-112"]
    method: screenshot
    description: "截图验证 MULTI 审批人 disabled 状态"
    what_to_check: "截图：「1级审批人」Select 显示 liyanda、lujiabao 两个 Tag，背景色为 disabled 灰色，点击后无下拉菜单弹出；检查 DOM 中 .ant-select-disabled class 存在或 Select 元素有 disabled 属性"

  - id: HV-S2m-02
    tc_ids: ["TC-NWO-112"]
    method: network
    description: "抓包验证模板详情接口返回 MULTI 类型"
    what_to_check: "DevTools Network → GET /mapi/cs/issue/config/28（选模板时触发），Response data.approvalConfigs[0].approvalConfig[0].type='MULTI'，approvalList.length=2"
