name: "S8-我已审批列表"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-041","TC-NWO-042"]
depends_on: ["S5"]

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/approved-list"
    description: "S8-01: 导航到我已审批列表页"

  - action: assert
    description: "S8-02: 列表加载(POST /mapi/cs/issue/normal/approve/list)，展示当前用户已审批工单；结构与名单申请列表一致(同列/同筛选/行操作 查看+删除)"

  - action: assert
    description: "S8-03: S5 通过的 [FLOW] 工单出现在列表中"

  - action: click
    description: "S8-04: 点击某行「查看」"

  - action: assert
    description: "S8-05: 跳转详情页(GET /mapi/cs/issue/normal/{id})正常加载"

human_verify:
  - id: HV-S8-01
    tc_ids: ["TC-NWO-041"]
    method: screenshot
    description: "截图验证我已审批列表包含 S5 工单"
    what_to_check: "截图：列表中能找到「[FLOW]UI自动化_新建单」行，状态显示「已完结」，当前处理人列为空（审批完结）"

  - id: HV-S8-02
    tc_ids: ["TC-NWO-042"]
    method: sql
    description: "SQL 验证审批日志存在"
    sql: |
      SELECT l.issue_id, l.step_code, l.operate_status, l.operator_id, l.operate_desc
      FROM t_cs_issue_log l
      JOIN t_cs_issue i ON l.issue_id = i.issue_id
      WHERE i.issue_name = '[FLOW]UI自动化_新建单'
        AND l.step_code = 'APPROVE'
        AND l.operate_status = 'SUCCESS'
      ORDER BY l.operate_time DESC LIMIT 1;
    expected: "存在一条 operate_status='SUCCESS' 的审批日志，operate_desc='UI自动化审批通过'，operator_id 为 liyanda 的 id"
