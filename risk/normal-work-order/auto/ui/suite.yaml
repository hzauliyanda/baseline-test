name: "风控普通工单 - UI 测试套件"
base_url: "https://test-risk.inshopline.com"

# 登录：使用持久化 Chrome profile（已登录 liyanda），执行前确保登录态有效
# 若登录态失效，请在 Chrome 窗口手动登录后重跑
login:
  enabled: false
  note: "依赖持久化 profile 登录态（liyanda），不在此处自动登录"

cases:
  - file: s1-list-query.yaml
    name: "S1: 名单申请列表查询与筛选"
    depends_on: []
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s2-create-workorder.yaml
    name: "S2: 新建工单提交"
    depends_on: []
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s3-view-detail.yaml
    name: "S3: 查看工单详情"
    depends_on: ["S2"]
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s4-edit-carbon.yaml
    name: "S4: 编辑抄送名单"
    depends_on: ["S2"]
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s5-approve-pass.yaml
    name: "S5: 审批通过"
    depends_on: ["S2"]
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s6-approve-reject.yaml
    name: "S6: 审批驳回"
    depends_on: ["S2"]
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s7-delete.yaml
    name: "S7: 删除工单"
    depends_on: ["S6"]
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s8-approved-list.yaml
    name: "S8: 我已审批列表"
    depends_on: ["S5"]
    entry_url: "/risk-cooperation/cs/normal-work-order/approved-list"

  - file: s9-template-list.yaml
    name: "S9: 模版管理列表"
    depends_on: []
    entry_url: "/risk-cooperation/cs/normal-work-order/template"

  # ---- 前端代码覆盖审计补充场景（2026-08-04）----
  - file: s1-cache.yaml
    name: "S1-cache: 会话缓存筛选条件恢复"
    depends_on: []
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s2-draft.yaml
    name: "S2-draft: 草稿保存与待提交编辑"
    depends_on: []
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s2-area.yaml
    name: "S2-area: 运营地区联动（商家入驻→shenhuanhuan测试 id=496，运营地区选CN）"
    depends_on: []
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s2-multi-approval.yaml
    name: "S2-multi: MULTI 多人审批人禁用（其他→测试工单类型-一级多人审批 id=28）"
    depends_on: []
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s2-file-limit.yaml
    name: "S2-file-limit: 文件上传5MB前端拦截（其他→测试材料数量 id=73，⚠️ 需准备>5MB测试文件）"
    depends_on: []
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s4-neg.yaml
    name: "S4-neg: 清空抄送人前端拦截"
    depends_on: ["S2"]
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s6-resubmit.yaml
    name: "S6-resubmit: 驳回后重新提交"
    depends_on: ["S6"]
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s7-no-permission.yaml
    name: "S7-no-permission: 无权限删除按钮灰显不可点"
    depends_on: ["S2"]
    entry_url: "/risk-cooperation/cs/normal-work-order/list"

  - file: s8-filter.yaml
    name: "S8-filter: 我已审批Tab筛选区差异（无处理人字段）"
    depends_on: []
    entry_url: "/risk-cooperation/cs/normal-work-order/approved-list"

  - file: s9-no-del.yaml
    name: "S9-no-del: canDel=false 模板无编辑/删除按钮"
    depends_on: []
    entry_url: "/risk-cooperation/cs/normal-work-order/template"
