name: "S23-列表筛选：创建人/处理人与创建时间"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-007","TC-NWO-008"]
frontend_branch: "F-E02(createUserId / currentHandleUserId / createdTime RangePicker)"
depends_on: []
note: |
  覆盖列表筛选区 创建人/处理人 用户下拉 + 创建时间范围筛选。
  已 ego-browser 实测(2026-08-12)：创建人/处理人为 showSearch 远程用户选择(有搜索输入框，需输入关键字加载候选)；
  创建时间为 RangePicker 且带时间(isRange=true、hasTime=true，起止 datetime)。

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S23-01: 导航到列表页"

  # 创建人
  - action: input
    description: "S23-02: 展开「创建人」下拉(showSearch)，输入关键字(如 liyanda)触发远程用户搜索，选中一个用户"
    value: "liyanda"

  - action: click
    description: "S23-03: 点「查询」"

  - action: assert
    description: "TC-NWO-007(创建人): 列表仅展示该创建人的工单(创建人列均为所选用户)"

  # 处理人（list 页特有，approved-list 无此字段）
  - action: input
    description: "S23-04: 点「重置」后，展开「处理人」下拉(showSearch)，搜索并选中一个用户(如 liyanda)"
    value: "liyanda"

  - action: click
    description: "S23-05: 点「查询」"

  - action: assert
    description: "TC-NWO-007(处理人): 列表仅展示当前处理人为所选用户的工单(当前处理人列一致)。注意『处理人』筛选项仅列表页有，我已审批(approved-list)页无(见 s8-filter)。"

  # 创建时间范围
  - action: click
    description: "S23-06: 点「重置」后，点开「创建时间」RangePicker，选择一个起止日期区间(带时间)"

  - action: click
    description: "S23-07: 点「查询」"

  - action: assert
    description: "TC-NWO-008(创建时间): 列表仅展示创建时间落在所选区间内的工单；区间为 [开始, 结束] 的 datetime 范围。（已实测控件为带时间的范围选择器）"

  - action: click
    description: "S23-08: 点「重置」"

  - action: assert
    description: "S23-09: 创建人/处理人/创建时间等所有筛选项清空，列表恢复默认查询"

human_verify:
  - id: HV-S23-01
    tc_ids: ["TC-NWO-007","TC-NWO-008"]
    method: network
    description: "抓包验证筛选参数下发"
    what_to_check: "POST /mapi/cs/issue/normal/list 的 Payload：创建人筛选带 createUserId、处理人带 currentHandleUserId、创建时间带 createdTime 起止(时间戳/日期区间)；Response.data.list 全部满足对应条件"

  - id: HV-S23-02
    tc_ids: ["TC-NWO-007"]
    method: screenshot
    description: "截图验证用户下拉为远程搜索"
    what_to_check: "创建人/处理人下拉输入关键字后出现匹配用户候选(showSearch 远程)，可选中；非静态全量列表"
