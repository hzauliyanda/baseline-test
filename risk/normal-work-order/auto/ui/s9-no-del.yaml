name: "S9-no-del-canDel=false模板无编辑删除按钮"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-119"]
frontend_branch: "F-10"
execution: "manual"
note: |
  覆盖「record.canDel=false 时，模板行操作列只渲染「复制」，编辑/删除按钮不渲染」分支。

  ⚠️ 后端机制（issue_config_controller.go:642）：
    canDel = (roleType == RiskOperator)
    即 canDel 是用户角色控制，与具体模板无关：
      - 当前用户 liyanda 是 RiskOperator → 所有模板 canDel=true → 编辑/删除按钮全部显示
      - 非 RiskOperator 用户 → canDel=false → 无编辑/删除按钮

  执行方式：需使用一个非 RiskOperator 角色的测试账号登录后执行。
  临时验证方式：
    1. 打开浏览器 DevTools Network，在模板列表请求响应中找 canDel 字段
    2. 用 JS 临时注入：在控制台把某行 canDel 改为 false，验证 React 重渲染后按钮消失

steps:
  - action: manual
    description: "S9d-01: 使用非 RiskOperator 角色账号登录 https://test-risk.inshopline.com"

  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/template"
    description: "S9d-02: 导航到模板管理列表页"

  - action: assert
    description: "TC-NWO-119: 所有模板行操作列只显示「复制」，无「编辑」/「删除」按钮（canDel=false，template/index.tsx:124-131）；与 RiskOperator 账号（三按钮）形成对照"

human_verify:
  - id: HV-S9d-01
    tc_ids: ["TC-NWO-119"]
    method: network
    description: "抓包验证接口返回 canDel=false"
    what_to_check: "DevTools Network → POST /mapi/cs/issue/config/list（非 RiskOperator 账号），Response data.list 任意行的 canDel 字段值为 false；对比 liyanda（RiskOperator）同接口 canDel=true；后端代码 issue_config_controller.go:642：isCanDel = (roleType == RiskOperator)"

  - id: HV-S9d-02
    tc_ids: ["TC-NWO-119"]
    method: screenshot
    description: "截图对比两个账号操作列差异"
    what_to_check: "截图1（非 RiskOperator 账号）：模板列表每行操作列只有「复制」1 个按钮；截图2（liyanda RiskOperator）：每行有「复制」「编辑」「删除」3 个按钮；两图形成对照"
