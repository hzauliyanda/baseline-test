name: "S2-file-limit-文件上传5MB前端拦截"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-113"]
frontend_branch: "F-06"
note: |
  覆盖「文件上传 >5MB，前端直接 message.error 拦截，不发起 fileUpload 接口请求」分支。
  模板：「测试材料数量」(issueConfigId=73, subIssueType=OTHER)
    materialsConfig: name=材料, inputType=FILE, isNotNull=yes（必填文件字段）
  在新建弹窗中：工单类型选「其他」→ 工单模板选「测试材料数量」
  测试文件：准备一个 >5MB 的本地文件（如视频/压缩包），填入 file_path。

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S2f-01: 导航到列表页"

  - action: click
    description: "S2f-02: 点击「新建工单」按钮"

  - action: click
    description: "S2f-03: 工单类型 Radio 选「其他」"

  - action: select
    description: "S2f-04: 工单模板下拉（mousedown 触发）选「测试材料数量」(issueConfigId=73)"
    value: "测试材料数量"

  - action: assert
    description: "S2f-05: 第二层弹窗展开，申请材料区域出现「材料」文件上传字段（FileUpload 组件，必填）"

  - action: upload
    description: "S2f-06: 在「材料」上传一个 >5MB 的文件（⚠️ 替换为实际 >5MB 文件路径，如 ~/Downloads/test-large.zip）"
    file_path: "~/Downloads/test-large.zip"

  - action: assert
    description: "TC-NWO-113: 出现 error toast「文件大小不能超过5MB!」（add-normal-order.tsx:341），文件未出现在 FileUpload 组件列表中，且 POST /mapi/cs/issue/base/file/upload 接口未被调用"

human_verify:
  - id: HV-S2f-01
    tc_ids: ["TC-NWO-113"]
    method: screenshot
    description: "截图验证错误 toast 内容"
    what_to_check: "截图：页面右上角出现红色 error message toast，文案为「文件大小不能超过5MB!」；FileUpload 文件列表区域为空，无文件名显示"

  - id: HV-S2f-02
    tc_ids: ["TC-NWO-113"]
    method: network
    description: "抓包验证 fileUpload 接口未被调用"
    what_to_check: "DevTools Network 中搜索 file/upload，确认超限上传操作后无新增的 POST /mapi/cs/issue/base/file/upload 请求（前端 file.size > 5242880 直接 return false，不发网络请求）"
