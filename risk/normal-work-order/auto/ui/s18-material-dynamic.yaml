name: "S18-申请材料动态字段渲染与校验"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-019"]
frontend_branch: "F-C04(getFormWithType 按 inputType 渲染 + required 提示 + 图片≥9隐藏 + 5MB)"
depends_on: []
note: |
  覆盖申请材料区(add-normal-order.tsx getFormWithType :419-541)按材料类型动态渲染：
    · TEXT  → Input.TextArea maxLength=500，placeholder「请输入{字段名}」，required 时必填
    · ENUM  → Select，选项来自 configValue，required 时必填
    · FILE  → FileUpload，required 时提示「请上传文件」
    · IMG   → Upload picture-card，required 时提示「请上传图片」；已传≥9张隐藏上传按钮
    · 上传格式/大小提示(实测)：「支持 .xls, .xlsx, .xlsb, .xlsm, .xlst, .doc, .docx, .pdf, .jpg, .jpeg, .png, .zip, .rar 格式，大小不能超过5MB」
    · onAddFile: 单文件 >5MB → message.error「文件大小不能超过5MB!」(见 s2-file-limit.yaml，此处不重复)
  实测(2026-08-12)：模板『测试多个材料-001』(其他类型)含 14 个「配置字段」，TEXT 型渲染为 TextArea(placeholder『请输入配置字段N』)、FILE/IMG 型渲染 Upload，上传提示文案与格式列表一致。
  ⚠️ 该模板材料均为【非必填】(isNotNull=no)，故未触发「请上传文件/请上传图片」必填提示——
     材料【必填】提示需用带 isNotNull=yes 材料的模板(如『其他 → 测试材料数量 id=73』)验证，标记为待实测。

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S18-01: 导航到列表页"

  - action: click
    description: "S18-02: 新建工单 → 工单类型「其他」→ 工单模板『测试多个材料-001』，进第二层"

  - action: assert
    description: "S18-03(类型渲染): 申请材料区按类型动态渲染——TEXT 型为 TextArea(placeholder『请输入配置字段N』)；FILE/IMG 型为 Upload 上传控件。（已实测存在 14 个配置字段 + Upload）"

  - action: assert
    description: "S18-04(上传提示): Upload 控件下方提示『支持 .xls,.xlsx,.xlsb,.xlsm,.xlst,.doc,.docx,.pdf,.jpg,.jpeg,.png,.zip,.rar 格式，大小不能超过5MB』。（已实测文案一致）"

  # 图片≥9 隐藏上传按钮（需 IMG 型材料）
  - action: assert
    description: "S18-05(IMG≥9): 对 IMG 型材料，连续上传至 9 张后，图片上传的『+』按钮隐藏(maxCount=9)。（代码确认，需带图片材料模板实跑）"

  # 材料必填（含必填材料的模板：其他 → 测试材料数量）
  - action: assert
    description: |
      TC-NWO-019(材料必填): 已 ego-browser 实测(2026-08-12，模板『其他 → 测试材料数量』，含 1 个必填「材料」Upload)：
        · 「材料」字段 label 带必填星号(ant-form-item-required=true)——字段确为必填；
        · 但【空表单点完成时】，inline 校验错误仅出现 工单名称「请输入工单名称」+ 主键值「请输入商家账号，输入多个请分别按回车键」两条，
          「材料」Form.Item 下【无 inline 错误、无 error toast】——即材料必填拦截【不随空提交同步飘红】，
          与纯代码推断的「请上传文件/请上传图片」inline 提示【不一致】。
        · 材料必填的真实拦截点需在 工单名称+主键值 填通后才能观察(疑似 getParams/提交阶段或后端校验)；
          因该表单 antd 受控输入填充摩擦大，此断言的「填通后材料是否拦截」标记为【待后续用固化脚本或接口层验证】。
      ⚠️ 结论：材料字段必填=真(有星号)，但校验时机/表现与其它必填不同，勿照搬「请上传文件」文案。

human_verify:
  - id: HV-S18-01
    tc_ids: ["TC-NWO-019"]
    method: screenshot
    description: "截图验证材料按类型渲染 + 上传提示"
    what_to_check: "TEXT 字段是多行文本框；文件/图片字段是 Upload 控件且下方有『…格式，大小不能超过5MB』提示"

  - id: HV-S18-02
    tc_ids: ["TC-NWO-019"]
    method: screenshot
    description: "截图验证必填材料提示(需必填材料模板)"
    what_to_check: "用带必填材料的模板空提交，FILE/IMG/TEXT/ENUM 各报对应必填提示；图片传满9张后上传按钮消失"
