name: "S1-cache-会话缓存筛选条件恢复"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-120"]
frontend_branch: "F-01"
note: "覆盖「useProRequestCache：离开列表页再回来时，sessionStorage 里的查询条件自动回填到 form，并触发重新查询」分支"

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S1c-01: 导航到列表页"

  - action: select
    description: "S1c-02: 在「处理状态」筛选项选择「待审批」（mousedown 打开下拉）"
    value: "待审批"

  - action: click
    description: "S1c-03: 点击「查询」按钮，列表按条件过滤"

  - action: assert
    description: "S1c-04: 列表仅显示「待审批」状态的工单"

  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list/detail/1"
    description: "S1c-05: 跳转到任意详情页（模拟离开列表页）"

  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S1c-06: 回到列表页"

  - action: assert
    description: "TC-NWO-120: 筛选区「处理状态」字段自动回填「待审批」（sessionStorage 缓存恢复），列表数据与 S1c-04 一致，未重置为全量查询（list/index.tsx:72-83，isPageInit=true 时使用 cacheParams）"

human_verify:
  - id: HV-S1c-01
    tc_ids: ["TC-NWO-120"]
    method: screenshot
    description: "截图验证筛选区条件回填"
    what_to_check: "步骤 S1c-06（返回列表页）后截图：顶部筛选区「处理状态」下拉显示「待审批」Tag（已回填），列表数据只包含待审批工单（与 S1c-04 截图内容一致）"

  - id: HV-S1c-02
    tc_ids: ["TC-NWO-120"]
    method: network
    description: "抓包验证回填后查询请求携带缓存参数"
    what_to_check: "DevTools Network → 回到列表页时自动触发的 POST /mapi/cs/issue/normal/list，Request Body 中包含 issueStatus='PENDING_APPROVE'（对应「待审批」的枚举值）而非空值，证明缓存参数被使用而非全量查询"
