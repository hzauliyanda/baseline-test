name: "S13-模板审批与运营地区配置"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-050"]
frontend_branch: "F-T04(approval-config.tsx: 地区必填/禁用、审批必填、最多5级、抄送人必填)"
depends_on: []
note: |
  覆盖审批配置区前端独有分支(approval-config.tsx)：
    · 运营地区 operateAreaList：fieldsOuter.length>1 必填「请选择运营地区」；length==1 时 disabled(:77-104)
    · 每级审批人 approvalList 必填「请选择审批人」；审批类型 type 必填「请选择审批类型」(SINGLE/MULTI)
    · 添加多级审批 length>4 → message.error「审批人最多五级」(:209-217)
    · 抄送人 carbonList 必填「请输入抄送人邮箱，多个英文逗号分隔」(:235-253)
    · 品牌保护(BRAND_PROTECTION)时「添加运营地区」按钮隐藏(:26)

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/template/add"
    description: "S13-01: 导航到模板新建页"

  - action: select
    description: "S13-02: 模板类型选「名单申请」(NAME_LIST_APPLY)，展示 运营地区/审批人/审批类型/抄送人 配置"
    value: "名单申请"

  - action: assert
    description: |
      S13-03: 审批配置区默认可见(实测：不依赖选类型，选名单申请后含运营地区)。
      结构为「地区审批配置N」块，每块内含 运营地区 + 一级审批人 + 审批类型 + 多级审批人；块外有抄送人。
      按钮：「添加运营地区」(新增地区块)、每块内「添加多级审批人」。

  # 运营地区 单块 disabled → 多块可用/必填
  - action: click
    description: "S13-04: 点击「添加运营地区」新增第二个地区审批配置块"

  - action: assert
    description: "TC-NWO-050(地区): 已 ego-browser 实测——单个地区块时「运营地区」Select 为 disabled；添加第二块后两块运营地区均变 enabled(可选、必填)；删回一块时又 disabled 并清空第 0 项。"

  # 审批必填
  - action: click
    description: "S13-05: 不填审批人/审批类型，直接点「完成」"

  - action: assert
    description: "TC-NWO-050(审批必填): 报错「请选择审批人」「请选择审批类型」；抄送人为空时报「请输入抄送人邮箱，多个英文逗号分隔」；运营地区(多块)报「请选择运营地区」"

  # 审批最多5级
  - action: click
    description: "S13-06: 连续点击「添加多级审批人」直到 5 级，再点第 6 次"
    value: "add-to-6"

  - action: assert
    description: "TC-NWO-050(上限): 已 ego-browser 实测——单个地区块内审批级封顶 5 级(一/二/3/4/5级审批人)，第 6 次添加被拦，出现 error toast「审批人最多五级」。注意上限是【每个地区审批配置块】各自 5 级。"

  # 审批类型选项
  - action: select
    description: "S13-07: 展开「审批类型」下拉，确认选项为 单人审批(SINGLE)/多人同时审批(MULTI)"
    value: "单人审批"

  - action: assert
    description: "S13-08: 审批类型可正常选择单人/多人"

human_verify:
  - id: HV-S13-01
    tc_ids: ["TC-NWO-050"]
    method: screenshot
    description: "截图验证审批级数上限与必填"
    what_to_check: "①第6次添加审批级时 error toast「审批人最多五级」，级数=5；②空表单点完成时 审批人/审批类型/抄送人 均飘红必填提示"

  - id: HV-S13-02
    tc_ids: ["TC-NWO-050"]
    method: screenshot
    description: "截图验证运营地区禁用/必填切换"
    what_to_check: "单个运营地区块时该 Select disabled(灰)；添加第二块后两块均变必填(可选、飘红)；删回一块时又 disabled"
