name: "S12-模板材料字段配置分支"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-049"]
frontend_branch: "F-T03(material-config.tsx: ENUM 限定/枚举值联动/重名/最多20)"
depends_on: []
note: |
  覆盖材料配置区前端独有分支(material-config.tsx)：
    · 材料类型选项 文本框/文件/图片；枚举(ENUM)仅 OTHER 类型可选(:113-120)
    · inputType==ENUM 时显示「枚举值」必填(:129-157)
    · 字段名/英文名重复 → checkParams warning「材料字段中有字段名重复，请检查」(:52-80)
    · 添加材料 length>19 → message.error「配置材料最多20个」(:225-234)

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/template/add"
    description: "S12-01: 导航到模板新建页"

  - action: select
    description: "S12-02: 模板类型选「其他」(OTHER)，使材料配置区可配置且 ENUM 可选"
    value: "其他"

  - action: assert
    description: "S12-03: 「配置材料字段」区出现，OTHER 类型下【初始 0 行】(实测：不预置)，仅有「添加多材料」按钮"

  - action: click
    description: "S12-03b: 点击「添加多材料」新增第一行(字段名/字段名(英)/材料类型/是否必填)"

  # ENUM 仅 OTHER 可选 + 枚举值联动
  - action: select
    description: "S12-04: 第一行「材料类型」下拉(placeholder=请选择材料类型)展开，实测选项 文本框/文件/图片/枚举；选择「枚举」(ENUM)"
    value: "枚举"

  - action: assert
    description: "S12-05: 选枚举后，该行出现「枚举值」输入框(placeholder=请输入枚举值，多个英文逗号分隔)，必填。（已 ego-browser 实测 2026-08-12）"

  # 字段名重复 warning
  - action: input
    description: "S12-06: 第一行「字段名」填 dupName，「字段名(英)」填 dupNameEn，枚举值填 a,b"
    value: "dupName"

  - action: click
    description: "S12-07: 点击「添加多材料」新增第二行"

  - action: input
    description: "S12-08: 第二行「字段名」也填 dupName(与第一行相同)，材料类型选「文本框」"
    value: "dupName"

  - action: click
    description: "S12-09: 补齐两行其余必填项后点「完成」提交"

  - action: assert
    description: "TC-NWO-049(重名): 出现 warning toast「材料字段中有字段名重复，请检查」，未提交成功"

  # 最多20个上限
  - action: click
    description: "S12-10: 连续点击「添加多材料」直到已有 20 行，再点第 21 次"
    value: "add-to-21"

  - action: assert
    description: "S12-11: 第 21 次添加被拦，出现 error toast「配置材料最多20个」，材料行数保持 20。（已 ego-browser 实测：封顶 20 + toast 文案一致）"

  # 反向：非 OTHER 无 ENUM 选项
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/template/add"
    description: "S12-12: 重新进入新建页，类型选「名单申请」(NAME_LIST_APPLY)，点「添加多材料」加一行"

  - action: select
    description: "S12-13: 模板类型选「名单申请」，加材料行后展开材料类型下拉"
    value: "名单申请"

  - action: assert
    description: "S12-14: 非 OTHER 类型下，材料类型选项仅 文本框/文件/图片，【无「枚举」选项】。（已 ego-browser 实测）"

human_verify:
  - id: HV-S12-01
    tc_ids: ["TC-NWO-049"]
    method: screenshot
    description: "截图验证枚举联动与上限拦截"
    what_to_check: "①材料类型选枚举后出现「枚举值」必填框；②第21次添加时右上角 error toast「配置材料最多20个」，行数=20"

  - id: HV-S12-02
    tc_ids: ["TC-NWO-049"]
    method: screenshot
    description: "截图验证重名 warning 与 ENUM 类型限定"
    what_to_check: "①两行同名点完成出现 warning「材料字段中有字段名重复，请检查」；②名单申请类型下材料类型下拉无「枚举」项"
