name: "S20-终态工单不可再审批与详情只读"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-025","TC-NWO-033","TC-NWO-029"]
frontend_branch: "F-D02(审批区/按钮 = isApprover && status∈{待审批,审批中})"
depends_on: []
note: |
  覆盖「非可审批状态(已完结/已驳回)详情：不显示审批操作区与通过/驳回按钮」+「不同状态详情可读」。
  detail/index.tsx：审批操作区+按钮显隐 = isApprover && status ∈ {待审批'1', 审批中'2'}(:363-365,416-418)。
  已 ego-browser 实测(2026-08-12，已完结工单 6289)：无「审批操作」区、无「通过/驳回」按钮、无抄送「编辑」，基础信息只读可读。

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S20-01: 导航到列表页，找一条『已完结』(或『已驳回』)的工单"

  - action: click
    description: "S20-02: 点该工单「查看」进入详情"

  - action: assert
    description: |
      TC-NWO-033: 已完结/已驳回详情【不显示】「审批操作」区，也【无】「通过」「驳回」按钮(status 不在 待审批/审批中)；
      抄送名单也无「编辑」按钮。（已实测：hasApproveBtn=false、hasApprovalArea=false、hasCarbonEdit=false）

  - action: assert
    description: |
      TC-NWO-025: 详情各区块可正常只读展示——基础信息(工单名称/工单模板/模板说明)、审批信息(申请说明/抄送名单)、
      审核进程时间线(创建工单→各级审批节点及结果)；基础字段均为只读文本(非输入态)。（已实测基础字段只读）

  # 补充：待审批状态详情【有】审批按钮，形成对比
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S20-03: 返回列表，找一条『待审批』且处理人=liyanda 的工单"

  - action: click
    description: "S20-04: 进入其详情"

  - action: assert
    description: "S20-05(对比): 待审批详情【显示】「审批操作」区 + 「通过/驳回」按钮 + 抄送「编辑」，与终态形成对比。（已实测 6281 有审批区）"

  - action: click
    description: "S20-06: 点抄送名单「编辑」进入内联编辑态"

  - action: assert
    description: |
      TC-NWO-029(编辑仅抄送可改): 进入编辑态后【仅】抄送名单变为可输入(Input+确定/取消)；
      基础信息(工单名称/工单模板/申请说明/主键值等)【仍为只读文本、不可编辑】。
      （已实测：待审批详情基础字段无可编辑输入框，仅抄送名单有「编辑」入口；抄送编辑流程见 s4-edit-carbon）

human_verify:
  - id: HV-S20-01
    tc_ids: ["TC-NWO-033","TC-NWO-025"]
    method: screenshot
    description: "截图对比终态 vs 待审批详情"
    what_to_check: "①已完结详情截图：无审批操作区、无通过/驳回按钮、无抄送编辑，各信息只读；②待审批详情截图：有审批操作区+通过/驳回按钮+抄送编辑"
