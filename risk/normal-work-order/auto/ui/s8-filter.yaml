name: "S8-filter-我已审批Tab筛选区差异"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-118"]
frontend_branch: "F-02"
note: "覆盖「pageType=approved-list 时，筛选区不渲染「处理人」字段（前端条件渲染）」分支"

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/approved-list"
    description: "S8f-01: 直接导航到「我已审批」列表页（pageType=approved-list）"

  - action: assert
    description: "TC-NWO-118: 筛选区包含「模板类型/工单模板/工单名称/创建人/创建时间/处理状态/主键值」共 7 个字段；「处理人」字段不存在于 DOM 中（pageType===approved-list 时 Form.Item 不渲染，list/index.tsx:374-390）"

human_verify:
  - id: HV-S8f-01
    tc_ids: ["TC-NWO-118"]
    method: screenshot
    description: "截图验证筛选区字段数量与缺失「处理人」"
    what_to_check: "截图：顶部筛选区完整截图，数出所有筛选 label，确认恰好 7 个（模板类型、工单模板、工单名称、创建人、创建时间、处理状态、主键值）；在 DOM 或截图中确认「处理人」label 不存在"

  - id: HV-S8f-02
    tc_ids: ["TC-NWO-118"]
    method: network
    description: "对照验证：切回普通列表页确认「处理人」存在"
    what_to_check: "导航到 /risk-cooperation/cs/normal-work-order/list（名单申请 Tab），截图筛选区，确认「处理人」字段出现（两页对比，差异仅在于处理人字段）"
