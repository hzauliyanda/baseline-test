name: "S15-新建弹窗双层门槛与取消"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-021"]
frontend_branch: "F-C01(showSecondLevel 门槛 + 宽度联动 + maskClosable:false)"
depends_on: []
note: |
  覆盖新建工单弹窗的双层结构门槛(add-normal-order.tsx)：
    · 第一层(仅工单类型+工单模板)时「保存」「完成」按钮 disabled；弹窗宽度 600px
    · 选齐 工单类型+工单模板(→showSecondLevel) 后进第二层：按钮 enabled；宽度 1180px
    · maskClosable:false（点遮罩不关闭）；点「取消」关闭弹窗且不新建
  已 ego-browser 实测(2026-08-12)：第一层保存/完成 disabled+600px；选名单申请+模板「名单申请测试1」后 enabled+1180px。

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S15-01: 导航到列表页，等「新建工单」按钮可见"

  - action: click
    description: "S15-02: 点击「新建工单」，打开新建弹窗"

  - action: assert
    description: |
      S15-03(第一层门槛): 弹窗标题「新建普通工单」；仅显示 工单类型(Radio: 名单申请/名单剔除/商家入驻/其他)+ 工单模板(Select「请选择工单模板」)；
      底部「保存」「完成」两个按钮均为 disabled；弹窗宽度 600px。（已实测）

  - action: click
    description: "S15-04: 选择工单类型「名单申请」Radio"

  - action: select
    description: "S15-05: 展开「工单模板」下拉，选择一个名单申请模板(如『名单申请测试1』)"
    value: "名单申请测试1"

  - action: assert
    description: |
      S15-06(进第二层): 选齐类型+模板后弹窗展开为第二层——出现 工单名称/名单数据/申请说明/N级审批人/抄送人 等；
      底部「保存」「完成」变为 enabled(可点)；弹窗宽度变 1180px。（已实测）

  - action: click
    description: "S15-07: 点击弹窗遮罩层(mask)区域"

  - action: assert
    description: "S15-08(maskClosable=false): 点遮罩弹窗不关闭，仍停留在新建弹窗"

  - action: click
    description: "S15-09: 点击「取消」按钮"

  - action: assert
    description: "TC-NWO-021: 弹窗关闭，回到列表页，未新建任何工单(列表无新增记录、无成功 toast)"

human_verify:
  - id: HV-S15-01
    tc_ids: ["TC-NWO-021"]
    method: screenshot
    description: "截图验证双层门槛"
    what_to_check: "①第一层截图：弹窗窄(600)、保存/完成置灰不可点；②选模板后截图：弹窗宽(1180)、保存/完成可点；③取消后回到列表无新增"
