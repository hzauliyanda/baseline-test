name: "S4-neg-清空抄送人前端拦截"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-114"]
frontend_branch: "F-07"
depends_on: ["S2"]
note: "覆盖「清空抄送人邮箱后点确定，前端 trim() 判空 → message.error，不调 edit 接口」分支"

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S4n-01: 导航到列表页"

  - action: click
    description: "S4n-02: 点击 S2 创建的 [FLOW] 工单（待审批状态）行的「查看」，进入详情页"

  - action: assert
    description: "S4n-03: 详情页已加载，「抄送名单」行显示抄送人邮箱，且「编辑」按钮可见（isApprover+isLastStep+待审批/审批中 条件成立）"

  - action: click
    description: "S4n-04: 点击「编辑」按钮，进入抄送名单内联编辑态"

  - action: assert
    description: "S4n-05: 出现 Input 输入框（已含原值）、「确定」和「取消」按钮"

  - action: input
    description: "S4n-06: 清空输入框内容（全选 + Delete，或 Ctrl+A → Backspace）"
    value: ""

  - action: click
    description: "S4n-07: 点击「确定」按钮"

  - action: assert
    description: "TC-NWO-114: 出现 error toast「抄送名单不能为空」，页面仍处于编辑态（未退出），且 POST /mapi/cs/issue/normal/edit 接口未被调用"

human_verify:
  - id: HV-S4n-01
    tc_ids: ["TC-NWO-114"]
    method: screenshot
    description: "截图验证 error toast 内容与编辑态保留"
    what_to_check: "截图：页面右上角出现红色 error message toast，文案为「抄送名单不能为空」；抄送名单输入框仍处于编辑状态（Input 可见，「确定」「取消」按钮仍在，未退出到只读态）"

  - id: HV-S4n-02
    tc_ids: ["TC-NWO-114"]
    method: network
    description: "抓包验证 edit 接口未被调用"
    what_to_check: "DevTools Network 中搜索 issue/normal/edit，确认点击「确定」后无新增的 POST /mapi/cs/issue/normal/edit 请求（trim() 判空提前 return，不发网络请求）"
