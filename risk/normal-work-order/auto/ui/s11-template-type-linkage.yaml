name: "S11-模板类型驱动字段显隐与联动清空"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-049"]
frontend_branch: "F-T02(formLabelShowMap + onValuesChange 清空)"
depends_on: []
note: |
  覆盖前端独有的「模板类型 → 字段显隐矩阵」与「切类型清空 name/namelistConfig」。
  ⚠️ ego-browser 实测(2026-08-12)：本页「模板类型」只有 4 个选项——名单申请/名单剔除/其他/商家入驻，
     【无 品牌保护(BRAND_PROTECTION)】；品牌保护模板在 brand 模块单独创建，故本用例不测品牌保护/写入资质中心。
  实测字段矩阵：
    其他(OTHER):          主键 + 配置材料字段
    名单申请(NAME_LIST_APPLY): 主键 + 配置材料字段 + 写入名单库 + 是否约定月份
    名单剔除(NAME_LIST_DELETE): 主键 + 剔除名单库(无材料配置、无月份)
    商家入驻(MERCHANT_ONBOARDING): 主键 + 配置材料字段 + 写入名单库(待实测确认)
  主键字段：OTHER 单选，其余多选。

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/template/add"
    description: "S11-01: 导航到模板新建页"

  # ---- OTHER ----
  - action: select
    description: "S11-02: 模板类型选「其他」(OTHER)"
    value: "其他"

  - action: assert
    description: "S11-03: 显示「主键字段」+「配置材料字段」区；不显示「写入名单库」「写入资质中心」「是否约定月份」；主键字段为单选(选一个后不能再多选)"

  - action: select
    description: "S11-04: 在主键字段选择一个值(如 merchantId)，记住当前选中值"
    value: "merchantId"

  # ---- 切到 NAME_LIST_APPLY，验联动清空 + 多选 + 新增字段 ----
  - action: select
    description: "S11-05: 模板类型切换为「名单申请」(NAME_LIST_APPLY)"
    value: "名单申请"

  - action: assert
    description: "TC-NWO-049(联动清空): 切换类型后「主键字段」已被清空(onValuesChange 清 name/namelistConfig)，不再保留 S11-04 选的值"

  - action: assert
    description: "S11-06: NAME_LIST_APPLY 下新增显示「写入名单库」区 +「是否约定月份」Radio；主键字段变为多选(可选多个 tag)；材料配置区仍在"

  # ---- 切到 NAME_LIST_DELETE，验无材料配置 ----
  - action: select
    description: "S11-07: 模板类型切换为「名单剔除」(NAME_LIST_DELETE)"
    value: "名单剔除"

  - action: assert
    description: "S11-08: 仅显示「主键字段」+「剔除名单库」区(注意标签是『剔除名单库』)；「配置材料字段」区不显示；「是否约定月份」不显示。（已 ego-browser 实测）"

  # ---- 切到 MERCHANT_ONBOARDING ----
  - action: select
    description: "S11-09: 模板类型切换为「商家入驻」(MERCHANT_ONBOARDING)"
    value: "商家入驻"

  - action: assert
    description: "S11-10: 显示「主键字段」+「配置材料字段」+「写入名单库」；无「是否约定月份」"

human_verify:
  - id: HV-S11-01
    tc_ids: ["TC-NWO-049"]
    method: screenshot
    description: "截图验证四种类型的字段显隐差异"
    what_to_check: "分别截 其他 / 名单申请 / 名单剔除 / 商家入驻 四张图，字段区符合实测矩阵；重点：名单剔除 无材料配置区且标签为『剔除名单库』、名单申请 有『是否约定月份』。本页无品牌保护选项。"

  - id: HV-S11-02
    tc_ids: ["TC-NWO-049"]
    method: screenshot
    description: "截图验证切类型清空主键"
    what_to_check: "OTHER 选中主键后切到 NAME_LIST_APPLY，主键字段输入框恢复空态（无 tag/无选中值）"
