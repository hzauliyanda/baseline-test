name: "S2-draft-草稿保存与待提交编辑"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-109", "TC-NWO-110"]
frontend_branch: "F-04"
note: "覆盖「保存草稿→待提交→列表显示编辑按钮→点编辑重入弹窗→完成」链路"

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S2d-01: 导航到名单申请列表页"

  - action: click
    description: "S2d-02: 点击「新建工单」(.ant-btn-primary)，打开新建弹窗"

  - action: click
    description: "S2d-03: 工单类型选「其他」radio"

  - action: select
    description: "S2d-04: 工单模板下拉(.ant-modal 内 .ant-select，mousedown 打开)，选「测试工单类型-一级审批」"
    value: "测试工单类型-一级审批"

  - action: input
    description: "S2d-05: 弹窗「工单名称」填写（.ant-modal 作用域，insertText）；值 [FLOW]UI草稿_保存单"
    value: "[FLOW]UI草稿_保存单"

  - action: input
    description: "S2d-06: 填写「店铺Handle」tags 输入，insertText 后按回车确认成 tag；值 flow-draft-handle-001"
    value: "flow-draft-handle-001"

  - action: click
    description: "S2d-07: 点击弹窗底部「保存」按钮（非「完成」）提交草稿（submitType=SUBMIT）"

  - action: assert
    description: "TC-NWO-109: 弹窗关闭，列表出现新工单，状态=「待提交」，操作列显示「编辑」按钮而非「查看」（前端分支：issueStatus===pendingCommit 显示 <a>编辑</a>）"

  # 待提交→点编辑→弹窗以编辑态重开
  - action: click
    description: "S2d-08: 点击该「待提交」工单行的「编辑」按钮，打开编辑弹窗"

  - action: assert
    description: "S2d-09: 弹窗标题为「编辑普通工单」，工单名称回显且 disabled（isEdit=true，name字段 disabled），审批人区域展示为只读文本"

  - action: click
    description: "S2d-10: 点击「完成」按钮提交（submitType=ADD）"

  - action: assert
    description: "TC-NWO-110: 弹窗关闭，工单状态由「待提交」变为「待审批」，操作列变为「查看」按钮（POST /mapi/cs/issue/normal/save 以 submitType=ADD 请求）"

human_verify:
  - id: HV-S2d-01
    tc_ids: ["TC-NWO-109"]
    method: screenshot
    description: "截图验证草稿保存后列表状态"
    what_to_check: "截图：列表中「[FLOW]UI草稿_保存单」行状态列显示「待提交」Tag（default 灰色），操作列显示「编辑」而非「查看」"

  - id: HV-S2d-02
    tc_ids: ["TC-NWO-109"]
    method: sql
    description: "SQL 验证草稿状态写库"
    sql: |
      SELECT issue_id, issue_name, issue_status
      FROM t_cs_issue
      WHERE issue_name = '[FLOW]UI草稿_保存单'
      ORDER BY created_at DESC LIMIT 1;
    expected: "issue_status='PENDING_COMMIT'（待提交）"

  - id: HV-S2d-03
    tc_ids: ["TC-NWO-110"]
    method: screenshot
    description: "截图验证编辑弹窗标题与字段 disabled"
    what_to_check: "步骤 S2d-09：截图弹窗标题为「编辑普通工单」（非「新建普通工单」）；「工单名称」Input 有 disabled 属性显示灰色；审批人区域为只读文本而非 Select"

  - id: HV-S2d-04
    tc_ids: ["TC-NWO-110"]
    method: sql
    description: "SQL 验证完成后状态变更"
    sql: |
      SELECT issue_id, issue_status
      FROM t_cs_issue
      WHERE issue_name = '[FLOW]UI草稿_保存单'
      ORDER BY created_at DESC LIMIT 1;
    expected: "issue_status='PENDING_APPROVE'（待审批），不再是 PENDING_COMMIT"
