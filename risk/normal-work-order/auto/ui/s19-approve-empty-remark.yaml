name: "S19-空备注审批拦截"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-035"]
frontend_branch: "F-D01(approveDesc 必填 validateFields 拦截)"
depends_on: []
note: |
  覆盖详情页审批备注必填(detail/index.tsx onApprove :68-80，approveDesc required maxLength=200)。
  已 ego-browser 实测(2026-08-12，工单 6281 待审批·liyanda 为1级审批人)：备注框带必填星号，空备注点「通过」→ inline 报「请输入备注」，不发起审批。

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S19-01: 导航到列表页，找一条『待审批』且当前处理人=liyanda 的工单"

  - action: click
    description: "S19-02: 点该工单「查看」进入详情(URL /list/detail/{id})；确认当前用户为审批人，出现「审批操作」区含 备注 + 「驳回」「通过」按钮"

  - action: assert
    description: "S19-03: 审批备注(approveDesc)字段带必填星号(ant-form-item-required)，初始为空"

  - action: click
    description: "S19-04: 不填备注，直接点「通过」按钮"

  - action: assert
    description: "TC-NWO-035(通过): 备注字段 inline 报错「请输入备注」，未发起审批(未跳转、无成功 toast、状态不变)。（已实测）"

  - action: click
    description: "S19-05: 同样不填备注，点「驳回」按钮"

  - action: assert
    description: "TC-NWO-035(驳回): 同样报「请输入备注」拦截，未发起驳回。（驳回路径与通过共用 approveDesc 必填校验）"

human_verify:
  - id: HV-S19-01
    tc_ids: ["TC-NWO-035"]
    method: screenshot
    description: "截图验证空备注拦截"
    what_to_check: "截图：备注框下方红字「请输入备注」；页面仍在详情页审批态，工单状态未变"

  - id: HV-S19-02
    tc_ids: ["TC-NWO-035"]
    method: network
    description: "抓包验证 approve 接口未调用"
    what_to_check: "DevTools Network：空备注点通过/驳回后无 POST /mapi/cs/issue/normal/approve 请求(validateFields 失败提前 return)"
