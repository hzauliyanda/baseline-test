name: "S7-no-permission-无权限删除按钮灰显不可点"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-117"]
frontend_branch: "F-08"
note: "覆盖「工单非驳回状态或非创建人时，删除按钮显示 not-allowed 样式，点击无响应，不弹确认框」分支"

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S7p-01: 导航到列表页，确保有「待审批」或「审批中」状态的工单（S2 创建）"

  - action: assert
    description: "TC-NWO-117-step1: 找到状态为「待审批」的 [FLOW] 工单行，删除按钮存在 class「no-permission-color not-allowed」（CSS cursor:not-allowed），视觉呈灰色"

  - action: click
    description: "S7p-02: 点击该行的灰色「删除」按钮"

  - action: assert
    description: "TC-NWO-117-step2: 无确认弹框出现，DELETE /mapi/cs/issue/base/{issueId} 接口未被调用（onClick early-return，因 hasDeletePermission=false）"

human_verify:
  - id: HV-S7p-01
    tc_ids: ["TC-NWO-117"]
    method: screenshot
    description: "截图验证删除按钮灰色 not-allowed 样式"
    what_to_check: "截图：「待审批」工单行的「删除」按钮呈灰色（class 含 no-permission-color），鼠标悬停时 cursor 为 not-allowed；对比旁边「查看」按钮的正常蓝色 cursor:pointer"

  - id: HV-S7p-02
    tc_ids: ["TC-NWO-117"]
    method: network
    description: "抓包验证点击灰色按钮后无 DELETE 请求"
    what_to_check: "DevTools Network 中筛选 XHR，点击灰色删除按钮后无新增 DELETE /mapi/cs/issue/base/{issueId} 请求，也无确认弹框（Modal.confirm）出现"
