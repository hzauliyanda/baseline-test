name: "S2-新建工单提交"
base_url: "https://test-risk.inshopline.com"
covers: ["TC-NWO-012","TC-NWO-013","TC-NWO-014","TC-NWO-015","TC-NWO-016","TC-NWO-019"]
provides: "一条 [FLOW] 标记的其他类型工单（待审批），供 S3/S4/S5/S7 使用"

steps:
  - action: navigate
    url: "/risk-cooperation/cs/normal-work-order/list"
    description: "S2-01: 导航到名单申请列表页"

  - action: click
    description: "S2-02: 点击「新建工单」按钮(主按钮 .ant-btn-primary)，打开「新建普通工单」弹窗"

  - action: assert
    description: "S2-03: 弹窗出现，含 工单类型 radio(名单申请/名单剔除/商家入驻/其他)、工单模板 下拉"

  # 工单类型联动
  - action: click
    description: "S2-04: 工单类型选择「其他」radio"

  - action: select
    description: "S2-05: 展开「工单模板」下拉(.ant-modal 内 .ant-select，mousedown 打开)，选择「测试工单类型-一级审批」"
    value: "测试工单类型-一级审批"

  - action: assert
    description: "S2-06: 表单展开动态字段：工单名称、店铺Handle、申请说明、证明材料修改后、1级审批人(默认 liyanda)"

  # 必填校验：先留空提交看提示
  - action: click
    description: "S2-07: 暂不填必填项，点击弹窗底部「完成」(.ant-modal-footer .ant-btn-primary)"

  - action: assert
    description: "S2-08: 工单名称、店铺Handle 字段提示必填，不发起 save 请求"

  # 真实填写（弹窗字段注意 id 冲突 + 真实键盘输入）
  - action: input
    description: "S2-09: 填写弹窗内「工单名称」(注意：与列表 #issueName id 冲突，须用 .ant-modal 作用域定位该输入框，并使用真实键盘输入 Input.insertText，支持中文)；值用 [FLOW]UI自动化_新建单"
    value: "[FLOW]UI自动化_新建单"

  - action: input
    description: "S2-10: 填写「店铺Handle」(tags 输入，真实键盘输入后按回车确认成 tag)；值 flow-ui-handle-001"
    value: "flow-ui-handle-001"

  - action: click
    description: "S2-11: 点击弹窗底部「完成」按钮提交"

  - action: assert
    description: "S2-12: 弹窗关闭，列表刷新出现新工单，状态=待审批（POST /mapi/cs/issue/normal/save 返回 SUCCESS）"

human_verify:
  - id: HV-S2-01
    tc_ids: ["TC-NWO-012","TC-NWO-013"]
    method: screenshot
    description: "截图验证必填校验弹出"
    what_to_check: "步骤 S2-08 时截图：「工单名称」和「店铺Handle」字段下方显示红色必填提示，弹窗未关闭"

  - id: HV-S2-02
    tc_ids: ["TC-NWO-014","TC-NWO-015","TC-NWO-016"]
    method: screenshot
    description: "截图验证新建成功"
    what_to_check: "截图：列表首行出现「[FLOW]UI自动化_新建单」，状态列显示「待审批」Tag（warning 橙色），主键值列显示 flow-ui-handle-001"

  - id: HV-S2-03
    tc_ids: ["TC-NWO-014","TC-NWO-019"]
    method: sql
    description: "SQL 验证工单写库正确"
    sql: |
      -- 替换 issue_name 为实际值
      SELECT issue_id, issue_name, issue_status, issue_config_id, creator_id, deleted_at
      FROM t_cs_issue
      WHERE issue_name = '[FLOW]UI自动化_新建单'
      ORDER BY created_at DESC LIMIT 1;
    expected: "issue_status='PENDING_APPROVE'（待审批），deleted_at=0（未删除），creator_id 为 liyanda 对应 id"

  - id: HV-S2-04
    tc_ids: ["TC-NWO-019"]
    method: sql
    description: "SQL 验证主键字段写库"
    sql: |
      SELECT field_name, field_value FROM t_cs_issue_field_value
      WHERE issue_id = '<S2新建工单的 issue_id>'
        AND field_type = 'PRIMARY'
        AND deleted_at = 0;
    expected: "field_value 包含 flow-ui-handle-001"
