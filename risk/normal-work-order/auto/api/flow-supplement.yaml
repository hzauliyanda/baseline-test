# 断言两段式（key 存在=分桶，runner 无需改）：
#   assert:   🟢机器判定段（status/$.code/contains/exists；equals/contains 期望值支持 {{var}}，2026-08-15 C 起）
#   db_check: 🟡DB兜底段（runner 忽略→永不自动通过；真表名 SQL，<..._id>/<run_id> 执行时替换）
#   note:     ⏳待首跑回填 / 🔴需人工 的提示（runner 忽略）
# 负向的精确判据用 $.message contains '<中文文案>'（与 flow-negative 实跑口径一致）；未跑的只标 ⏳ 不硬锁。

name: risk-normal-work-order-supplement
desc: 普通工单模块【补充】接口流程——补 master 代码里探索漏抓的 14 个接口 + 关键负向分支（MULTI审批/并发锁/状态门/权限门/模板校验链/同步补偿）。主链路见 flow.yaml。
base_url: https://test-risk.inshopline.com
variables:
  cookie: '{{ENV:RISK_COOKIE}}'
  issue_config_id: '21'
  tpl_name: '[FLOW]sup模板{{run_id}}'
  notify_task_tame: '[FLOW]通知{{run_id}}'
  punish_sub_issue_type: OTHER
steps:
- id: self_role
  desc: 查自身角色类型（RISK_OPERATOR 运营 / NORMAL_USER 普通）——决定能否增删模板
  request:
    method: GET
    url: '{{base_url}}/mapi/cs/issue/base/self/roleType'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
    - path: $.data
      equals: RISK_OPERATOR   # ⏳待首跑确认：运营账号本应返此值，正向回读；首跑核对一次即锁死
- id: fixed_recipient
  desc: 查固定接收人（按处罚工单子类型 COMPLAINT/OTHER）
  request:
    method: GET
    url: '{{base_url}}/mapi/cs/issue/base/fixed/recipient'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
    params:
      punishSubIssueType: '{{punish_sub_issue_type}}'
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
  note: 🟢 读接口正常应 SUCCESS；⏳ 首跑确认 $.code=SUCCESS 后可补 equals
- id: file_upload_file
  desc: 文件上传(FILE 类别)——multipart/form-data，字段 newAttachments + category=FILE。runner 不便传文件时跳过本步手动验证
  skip_note: 需 multipart 文件；runner 不支持时手动 curl：category=FILE&newAttachments=@x.pdf。期望返回上传后的文件URL
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/base/file/upload'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
  assert:
    status: 200
    json: []
- id: config_brand_detail
  desc: 品牌保护模板详情（审批配置取首组）
  request:
    method: GET
    url: '{{base_url}}/mapi/cs/issue/config/brand/{{issue_config_id}}'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
    - path: $.data
      exists: true
- id: config_list_group
  desc: '按 issueType 分组查模板列表（PC: issueType=NORMAL/PUNISH）'
  request:
    method: GET
    url: '{{base_url}}/mapi/cs/issue/config/list/group/NORMAL'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
    - path: $.data
      exists: true
- id: config_complaints
  desc: 投诉工单模板详情（查最近 Punish+COMPLAINT 模板；无则 TEMPLATE_NOT_EXIST）
  request:
    method: GET
    url: '{{base_url}}/mapi/cs/issue/config/complaints'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
  assert:
    status: 200
    json: []
  note: ⏳ 无 Punish+COMPLAINT 模板时返回 TEMPLATE_NOT_EXIST（负向），首跑确认走哪支再锁
- id: config_save_create
  desc: 模板新建（POST /issue/config/save）——需 RISK_OPERATOR；按运营地区分组的二维审批配置
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/config/save'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      issueConfigName: '{{tpl_name}}'
      issueConfigDesc: flow-supplement 自动建模板
      issueConfigNameEn: '{{tpl_name}}'
      issueConfigDescEn: auto
      subIssueType: OTHER
      primaryKeyConfig:
      - name: storeHandle
      materialsConfig:
      - name: 说明
        isNotNull: 'no'
        inputType: TEXT
        materialsDesc: desc
      approvalConfigs:
      - approvalConfig:
        - step: 1
          type: SINGLE
          approvalList:
          - '253'
        operateAreaList:
        - ID
        carbonList:
        - liyanda@shoplineapp.com
      isWriteQualification: 0
      isAppointMonth: 0
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
  db_check:
  - table: t_cs_issue_config
    sql: SELECT id, sub_issue_type, status, deleted_at FROM t_cs_issue_config WHERE issue_config_name='[FLOW]sup模板<run_id>' ORDER BY id DESC LIMIT 1;
    expect: 1 行；sub_issue_type=OTHER；status=valid；deleted_at=0
    reason: 模板真的建进 t_cs_issue_config（save 只回 SUCCESS，configId 靠下一步 list 查回）
- id: config_find_id
  desc: save 接口仅返回 data:true 不返回 id，list 按名称查回 configId（字符串）
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/config/list'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      pageNum: 1
      pageSize: 5
      issueConfigName: '{{tpl_name}}'
  extract:
    new_config_id: $.data.list[0].issueConfigId
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
    - path: $.data.list[0].issueConfigId
      exists: true
    - path: $.data
      exists: true
- id: config_save_edit
  desc: 模板编辑（传 issueConfigId，名称不可改 TEMPLATE_NAME_CAN_NOT_MODIFY）
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/config/save'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      issueConfigId: '{{new_config_id}}'
      issueConfigName: '{{tpl_name}}'
      issueConfigDesc: flow-supplement 编辑后描述
      subIssueType: OTHER
      primaryKeyConfig:
      - name: storeHandle
      approvalConfigs:
      - approvalConfig:
        - step: 1
          type: SINGLE
          approvalList:
          - '253'
        operateAreaList:
        - ID
        carbonList:
        - liyanda@shoplineapp.com
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
  db_check:
  - table: t_cs_issue_config
    sql: SELECT issue_config_desc, status FROM t_cs_issue_config WHERE issue_config_name='[FLOW]sup模板<run_id>' AND status='valid' ORDER BY id DESC LIMIT 1;
    expect: 最新 valid 行 issue_config_desc='flow-supplement 编辑后描述'（编辑=软删旧+插新版本）
    reason: 编辑是否真落库为新版本
- id: config_refind_id
  desc: 编辑是软删旧记录+插新版本，原 configId 已 invalid，重新 list 查最新 valid 的 configId
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/config/list'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      pageNum: 1
      pageSize: 5
      issueConfigName: '{{tpl_name}}'
  extract:
    new_config_id: $.data.list[0].issueConfigId
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
    - path: $.data.list[0].issueConfigId
      exists: true
    - path: $.data
      exists: true
- id: config_delete
  desc: 模板删除（DELETE /issue/config/:configId；需 RISK_OPERATOR；处罚模板不可删 TEMPLATE_CANNOT_DELETE）
  request:
    method: DELETE
    url: '{{base_url}}/mapi/cs/issue/config/{{new_config_id}}'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
  db_check:
  - table: t_cs_issue_config
    sql: SELECT deleted_at FROM t_cs_issue_config WHERE id=<new_config_id>;
    expect: deleted_at != 0（模板软删生效）
    reason: 确认模板真被删
- id: config_save_no_auth
  desc: 负向：非运营角色(NORMAL_USER)建模板 → NO_AUTH（需用普通账号 cookie 跑）
  skip_note: 需 NORMAL_USER 账号 cookie；运营账号跑此步会成功。⏳期望(待回填)：$.code=NO_AUTH
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/config/save'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      issueConfigName: '[FLOW]noauth'
      issueConfigDesc: x
      subIssueType: OTHER
      approvalConfigs:
      - approvalConfig:
        - step: 1
          type: SINGLE
          approvalList:
          - '253'
        operateAreaList:
        - ID
  assert:
    status: 200
    json: []
  note: ⏳待回填(skip未跑,代码推断) 期望 $.code=NO_AUTH (config_controller:239)；需 NORMAL_USER cookie
- id: config_save_area_repeat
  desc: 负向：两个审批组运营地区重复 → 运营地区不能重复
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/config/save'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      issueConfigName: '[FLOW]arearepeat{{run_id}}'
      issueConfigDesc: x
      subIssueType: OTHER
      approvalConfigs:
      - approvalConfig:
        - step: 1
          type: SINGLE
          approvalList:
          - '253'
        operateAreaList:
        - ID
      - approvalConfig:
        - step: 1
          type: SINGLE
          approvalList:
          - '253'
        operateAreaList:
        - ID
  assert:
    status: 200
    json: []
  note: ⏳待回填(代码推断) 期望 $.message 含 '运营地区不能重复'（controller 层校验）
- id: notify_enums
  desc: 通知配置枚举（subIssueTypes/riskTypes/countryCodes）
  request:
    method: GET
    url: '{{base_url}}/mapi/cs/issue/notify/config/enums'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
    - path: $.data
      exists: true
- id: notify_save
  desc: 通知配置新建（字段拼写 taskTame；IssueType 后端硬编码 PUNISH）
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/notify/config/save'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      taskTame: '{{notify_task_tame}}'
      subIssueType: OTHER
      configDesc: flow-supplement 通知配置
      configs:
      - countryCode: ID
        emails:
        - liyanda@shoplineapp.com
  extract:
    notify_id: $.data
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
    - path: $.data
      exists: true
  db_check:
  - table: t_cs_notify_config
    sql: SELECT id, deleted_at FROM t_cs_notify_config WHERE id=<notify_id>;
    expect: 1 行；deleted_at=0
    reason: 通知配置真的建进 t_cs_notify_config
- id: notify_pages
  desc: 通知配置分页查询
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/notify/config/pages'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      pageNum: 1
      pageSize: 10
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
    - path: $.data
      exists: true
- id: notify_detail
  desc: 负向：通知配置详情（riskType 在当前租户失效 → 无效的风险类型）
  request:
    method: GET
    url: '{{base_url}}/mapi/cs/issue/notify/config/{{notify_id}}'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
  assert:
    status: 200
    json: []
  note: ⏳待回填(代码推断) 期望 $.message 含 '无效的风险类型' (notify_svc:127)
- id: notify_delete
  desc: 通知配置删除（物理删）
  request:
    method: DELETE
    url: '{{base_url}}/mapi/cs/issue/notify/config/{{notify_id}}'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
  assert:
    status: 200
    json:
    - path: $.code
      equals: SUCCESS
  db_check:
  - table: t_cs_notify_config
    sql: SELECT COUNT(*) FROM t_cs_notify_config WHERE id=<notify_id>;
    expect: 0（desc 标物理删；若=1 且 deleted_at!=0 则实为软删，首跑确认）
    reason: 确认删除生效及删除方式
- id: approve_notify_retry
  desc: 负向：审批完结后名单同步补偿重试（GET /approve/notify/:issueId）——SubIssueType=OTHER 会返回 ISSUE_TYPE_ERR（不同步）
  skip_note: 对已完结的名单申请工单调用才会真正同步；需先有已完结名单工单。⏳期望(待回填)：OTHER 类型 → ISSUE_TYPE_ERR
  request:
    method: GET
    url: '{{base_url}}/mapi/cs/issue/normal/approve/notify/{{issue_config_id}}'
    headers:
      appId: '4'
      version: v2
      Cookie: '{{cookie}}'
  assert:
    status: 200
    json: []
  note: ⏳待回填(skip未跑) 期望 ISSUE_TYPE_ERR（OTHER 类不同步）；需已完结名单工单
- id: approve_no_auth
  desc: 负向：非当前审批人审批 → NO_AUTH（approveStatus=SUCCESS）
  skip_note: 需 --set issue_id=<他人待审批工单id>（当前 cookie 非其审批人）
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/normal/approve'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      issueId: '{{issue_id}}'
      approveStatus: SUCCESS
      approveDesc: 非审批人尝试
  assert:
    status: 200
    json: []
  note: ⏳待回填 期望 $.code=NO_AUTH 或 ISSUE_CANNOT_APPROVED (save:334)；需 --set issue_id=<他人待审工单>
- id: approve_concurrent_lock
  desc: 负向：同一工单并发审批第二次抢锁失败 → TRY_AGAIN_LATER（需近乎同时两次请求）
  skip_note: 并发场景，单线程 runner 难复现；建议压测/手工。⏳期望(待回填)：TRY_AGAIN_LATER
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/normal/approve'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      issueId: '{{issue_id}}'
      approveStatus: SUCCESS
      approveDesc: 并发
  assert:
    status: 200
    json: []
  note: 🔴 并发抢锁 TRY_AGAIN_LATER，单线程 runner 难复现，压测/手工，见手动覆盖清单.md
- id: edit_not_last_approver
  desc: 负向：非最后一步审批人改抄送 → ISSUE_CANNOT_MODIFIED
  skip_note: 需 --set issue_id=<多级审批中、当前非末级审批人的工单id>
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/normal/edit'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      issueId: '{{issue_id}}'
      carbonList: x@shoplineapp.com
  assert:
    status: 200
    json: []
  note: ⏳待回填 期望 $.message 含 ISSUE_CANNOT_MODIFIED 语义(save:1724)；需多级审批前置，--set issue_id=<非末级工单>
- id: approve_status_anything_non_reject
  desc: 边界：approveStatus 传非 REJECT 的任意值（如 ABC）→ 走通过分支（代码未严格枚举校验）
  skip_note: 需 --set issue_id=<自有待审批工单id>；会真的把工单审批通过（有副作用）
  request:
    method: POST
    url: '{{base_url}}/mapi/cs/issue/normal/approve'
    headers:
      appId: '4'
      version: v2
      Content-Type: application/json
      Cookie: '{{cookie}}'
    json:
      issueId: '{{issue_id}}'
      approveStatus: ABC
      approveDesc: 非法枚举边界
  assert:
    status: 200
    json: []
  note: ⏳待回填 期望走通过分支=SUCCESS（代码未严格枚举校验）；需 --set issue_id=<自有待审工单>
