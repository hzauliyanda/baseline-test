name: risk-normal-work-order-paths
desc: >
  普通工单模块【缺失正向路径补充】——现有 flow 全是 submitType=ADD + SINGLE 单级审批 + IsWriteQualification=0，
  以下三条主干路径 0 覆盖：①submitType=SUBMIT 草稿暂存链 ②MULTI 多级/会签审批链 ③品牌授权(IsWriteQualification=1)。
  对照《接口用例-代码分支覆盖审计-2026-08-02.md》第二节 P2「整条路径缺失」。

# =====================================================================
# 断言规范（两段式 · 靠 key 的存在天然分桶，runner 无需改）—— 与 flow.yaml 一致
#   assert:    🟢机器判定段（runner 唯一评分）。只放 status / $.code equals / 静态子串 contains / exists。
#              equals/contains 期望值支持 {{var}}（2026-08-15 C 起，runner 用本轮 ctx 渲染）。
#   db_check:  🟡DB兜底段（runner 忽略，永不自动通过）。真表名真列名，<issue_id>/<run_id> 执行时替换。
#   skip_note: 🔴人工段（runner 跑不了 / 依赖前置 --set / 跨系统）。见 cases/手动覆盖清单.md。
# 出处标记：✅实跑确认(可锁死) / ⏳待首跑回填(仅代码推断，勿当已验证)。
# 注意：schema 里 issue_status 只列了 1待审批/2已驳回/3已完结/4待下发/5标注中/6标注完结，
#       "待提交(草稿)" 码不在其中 → 相关 expect 一律标 ⏳，首跑或查代码常量确认。
# =====================================================================
base_url: https://test-risk.inshopline.com

variables:
  cookie: "{{ENV:RISK_COOKIE}}"
  issue_config_id: "21"          # 其他类型一级审批模板（草稿链复用）
  approval_user_id: "253"        # liyanda
  approval_user_id2: ""          # 二级审批人 id（MULTI 需要第二个审批人，未配则 skip 相关步骤）
  tpl_name_multi: "[FLOW]multi模板{{run_id}}"
  tpl_name_brand: "[FLOW]brand模板{{run_id}}"

steps:

  # ============================================================
  # 路径一：submitType=SUBMIT 草稿暂存链
  #   save(SUBMIT,新建草稿) → 详情确认待提交 → save(SUBMIT,改草稿) → save(ADD,正式提交)
  #   覆盖 save:1648 状态分叉 / 1558 非待提交态门 / 707-713 删历史
  # ============================================================
  - id: draft_create
    desc: '[SUBMIT] 新建草稿（submitType=SUBMIT）→ 状态应为"待提交" (buildSaveIssueInfo:1648)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "SUBMIT"
        issueName: "[FLOW]draft{{run_id}}"
        applyDesc: "草稿"
        issueConfigId: "{{issue_config_id}}"
        approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }]
        carbonList: ["liyanda@shoplineapp.com"]
        primaryKeyConfig: [{ fieldName: "storeHandle", fieldInputType: "TEXT", fieldValue: ["draft-{{run_id}}"] }]
    extract: { draft_id: "$.data" }
    assert:                              # 🟢 接口层：草稿建单被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
        - { path: "$.data", exists: true }             # ✅ 返回 draft_id
    db_check:                            # 🟡 草稿真伪：状态是否=待提交、主键是否落库
      - table: t_cs_issue
        sql: "SELECT issue_status, sub_issue_type, deleted_at FROM t_cs_issue WHERE id=<draft_id>;"
        expect: "1 行；issue_status=<待提交码,⏳待回填>(非 1/2/3/4/5/6，见文件头说明)；deleted_at=0"
        reason: "SUBMIT 是否真建成草稿态而非直接待审批"
      - table: t_cs_issue_field_value
        sql: "SELECT field_value FROM t_cs_issue_field_value WHERE issue_id=<draft_id> AND field_type='PRIMARY' AND field_name='storeHandle' AND deleted_at=0;"
        expect: "field_value = 'draft-<run_id>'（非空）"
        reason: "缺陷1 同款：主键非空入参必须回读到真值"

  - id: draft_detail
    desc: '[SUBMIT] 详情确认状态=待提交，取字符串 issueId'
    request:
      method: GET
      url: "{{base_url}}/mapi/cs/issue/normal/{{draft_id}}"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    extract: { draft_id: "$.data.issueId" }
    assert:                              # 🟢 详情回读=我们建的草稿
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }            # ✅实跑确认
        - { path: "$.data.issueId", exists: true }         # ✅
        - { path: "$.data.issueName", contains: "[FLOW]" } # ✅ 回读名称
        - { path: "$.data.issueStatus", exists: true }     # ⏳期望(待回填):待提交码；此处仅锁字段存在

  - id: draft_resubmit
    desc: '[SUBMIT] 带 issueId 再存草稿（删历史+重建 save:197/707-713）'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "SUBMIT"
        issueId: "{{draft_id}}"
        issueName: "[FLOW]draft{{run_id}}"
        applyDesc: "草稿改一版"
        issueConfigId: "{{issue_config_id}}"
        approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }]
        carbonList: ["liyanda@shoplineapp.com"]
        primaryKeyConfig: [{ fieldName: "storeHandle", fieldInputType: "TEXT", fieldValue: ["draft2-{{run_id}}"] }]
    assert:                              # 🟢 接口层：草稿改版被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
    db_check:                            # 🟡 删历史+重建是否真生效：主键值应从 draft- 变 draft2-，无残留旧行
      - table: t_cs_issue_field_value
        sql: "SELECT field_value, deleted_at FROM t_cs_issue_field_value WHERE issue_id=<draft_id> AND field_type='PRIMARY' AND field_name='storeHandle';"
        expect: "有效行(deleted_at=0) field_value='draft2-<run_id>'；旧 'draft-<run_id>' 应已被删历史(无行或 deleted_at!=0)"
        reason: "验 save:707-713 删历史+重建，不是叠加出两条主键"

  - id: draft_submit_formal
    desc: '[SUBMIT→ADD] 正式提交（submitType=ADD，状态→待审批）'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "ADD"
        issueId: "{{draft_id}}"
        issueName: "[FLOW]draft{{run_id}}"
        applyDesc: "正式提交"
        issueConfigId: "{{issue_config_id}}"
        approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }]
        carbonList: ["liyanda@shoplineapp.com"]
        primaryKeyConfig: [{ fieldName: "storeHandle", fieldInputType: "TEXT", fieldValue: ["draft2-{{run_id}}"] }]
    assert:                              # 🟢 接口层：正式提交被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
    db_check:                            # 🟡 草稿→正式：状态是否真流转到待审批
      - table: t_cs_issue
        sql: "SELECT issue_status FROM t_cs_issue WHERE id=<draft_id>;"
        expect: "issue_status=1(待审批)"
        reason: "SUBMIT 草稿经 ADD 是否真转待审批（1 是已核实的确定码）"

  - id: draft_submit_on_approving
    desc: '[负向连带] 对已"待审批"工单再走 SUBMIT → 期望 ISSUE_STATUS_ERR（非待提交态门 saveBaseIssue:1558）'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "SUBMIT"
        issueId: "{{draft_id}}"
        issueName: "[FLOW]draft{{run_id}}"
        issueConfigId: "{{issue_config_id}}"
        approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }]
        carbonList: ["liyanda@shoplineapp.com"]
        primaryKeyConfig: [{ fieldName: "storeHandle", fieldInputType: "TEXT", fieldValue: ["x"] }]
    assert:                              # 🟢 负向：只锁 status；精确错误码待回填（negative 实测多返通用码）
      status: 200
      # ⏳期望(待回填): $.code=ISSUE_STATUS_ERR（代码推断 save:1558）。首跑抓真实 $.code 后回填 equals；
      #   若实际为通用 INVALID_ARGUMENT/系统异常，则按 flow-negative 惯例锁通用码。

  - id: draft_cleanup
    desc: '清理草稿工单'
    request:
      method: DELETE
      url: "{{base_url}}/mapi/cs/issue/base/{{draft_id}}"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert:                              # 🟢 接口层：删除被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ⏳待首跑回填（原仅锁 status；delete 正常返 SUCCESS）
    db_check:                            # 🟡 软删生效
      - table: t_cs_issue
        sql: "SELECT deleted_at FROM t_cs_issue WHERE id=<draft_id>;"
        expect: "deleted_at != 0（软删）"
        reason: "清理是否真软删掉草稿"

  # ============================================================
  # 路径二：MULTI 多级审批链
  #   建二级 MULTI 审批模板 → 建工单 → 一级审批(非末步,通知下一步) → 二级审批(末步,完结)
  #   覆盖 save:329/344/420/452 下半支、377/422 通知下一步
  # ============================================================
  - id: multi_tpl_save
    desc: '[MULTI] 建二级审批模板（step1 + step2）'
    skip_note: "🔴需 --set approval_user_id2=<第二个审批人id>；若二级也用 253 则单人两步，通知下一步分支仍可走"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueConfigName: "{{tpl_name_multi}}"
        issueConfigDesc: "二级审批"
        subIssueType: "OTHER"
        primaryKeyConfig: [{ name: "storeHandle" }]
        approvalConfigs:
          - approvalConfig:
              - { step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }
              - { step: 2, type: "SINGLE", approvalList: ["{{approval_user_id2}}"] }
            operateAreaList: ["ID"]
            carbonList: ["liyanda@shoplineapp.com"]
    assert:                              # 🟢 接口层：建模板被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认（依赖 approval_user_id2 已配）
    db_check:                            # 🟡 模板真伪
      - table: t_cs_issue_config
        sql: "SELECT id, deleted_at FROM t_cs_issue_config WHERE issue_config_name='[FLOW]multi模板<run_id>';"
        expect: "1 行有效模板(deleted_at=0)"
        reason: "二级审批模板真的建库了"

  - id: multi_tpl_find
    desc: '[MULTI] 查回 configId'
    skip_note: "🔴依赖 multi_tpl_save"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/list"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { pageNum: 1, pageSize: 5, issueConfigName: "{{tpl_name_multi}}" }
    extract: { multi_cfg_id: "$.data.list[0].issueConfigId" }
    assert:                              # 🟢 查回模板命中
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }                     # ✅实跑确认
        - { path: "$.data.list[0].issueConfigId", exists: true }    # ✅ 分页路径已被 extract 复用，确认存在

  - id: multi_wo_save
    desc: '[MULTI] 用二级模板建工单'
    skip_note: "🔴依赖 multi_cfg_id"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "ADD"
        issueName: "[FLOW]multi{{run_id}}"
        issueConfigId: "{{multi_cfg_id}}"
        approvalConfig:
          - { step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }
          - { step: 2, type: "SINGLE", approvalList: ["{{approval_user_id2}}"] }
        carbonList: ["liyanda@shoplineapp.com"]
        primaryKeyConfig: [{ fieldName: "storeHandle", fieldInputType: "TEXT", fieldValue: ["multi-{{run_id}}"] }]
    extract: { multi_wo_id: "$.data" }
    assert:                              # 🟢 接口层：建单被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
        - { path: "$.data", exists: true }             # ✅ 返回 multi_wo_id
    db_check:                            # 🟡 工单真伪
      - table: t_cs_issue
        sql: "SELECT issue_status, deleted_at FROM t_cs_issue WHERE id=<multi_wo_id>;"
        expect: "issue_status=1(待审批)；deleted_at=0"
        reason: "二级模板建单成功且落待审批"

  - id: multi_wo_detail
    desc: '[MULTI] 详情取字符串 issueId（approve 要 string，save 返回 number，链式坑）'
    skip_note: "🔴依赖 multi_wo_id"
    request:
      method: GET
      url: "{{base_url}}/mapi/cs/issue/normal/{{multi_wo_id}}"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    extract: { multi_wo_id: "$.data.issueId" }
    assert:                              # 🟢 详情回读
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }            # ✅实跑确认
        - { path: "$.data.issueId", exists: true }         # ✅
        - { path: "$.data.issueName", contains: "[FLOW]" } # ✅ 回读名称

  - id: multi_approve_step1
    desc: '[MULTI] 一级审批通过 → 非末步(isFinalStep=false)，通知二级审批人 (save:329/377/422)'
    skip_note: "🔴依赖 multi_wo_id；当前审批人须为一级 approval_user_id。通知二级审批人=跨系统，需人工看通知是否真发"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/approve"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{multi_wo_id}}", approveStatus: "SUCCESS", approveDesc: "一级通过" }
    assert:                              # 🟢 接口层：一级审批被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
    db_check:                            # 🟡 一级通过后应"未完结、进二级"，非直接完结
      - table: t_cs_issue
        sql: "SELECT issue_status, current_approve_step_status FROM t_cs_issue WHERE id=<multi_wo_id>;"
        expect: "issue_status != 3(未完结，仍待二级审批)；current_approve_step_status=<进二级的状态,⏳待回填>"
        reason: "验非末步分支：一级过了不能直接完结，必须流转到二级"

  - id: multi_approve_step2
    desc: '[MULTI] 二级审批通过 → 末步完结 (save:452 isFinalStep=true→IssueFinish)'
    skip_note: "🔴依赖 multi_wo_id；当前审批人须为二级 approval_user_id2（若与一级不同需换 cookie）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/approve"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{multi_wo_id}}", approveStatus: "SUCCESS", approveDesc: "二级通过完结" }
    assert:                              # 🟢 接口层：二级审批被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
    db_check:                            # 🟡 末步完结真伪
      - table: t_cs_issue
        sql: "SELECT issue_status, current_approve_step_status FROM t_cs_issue WHERE id=<multi_wo_id>;"
        expect: "issue_status=3(已完结)；current_approve_step_status='SUCCESS'"
        reason: "二级(末步)通过后工单真流转到已完结"

  - id: multi_cleanup_wo
    desc: '[MULTI] 清理工单'
    skip_note: "🔴依赖 multi_wo_id"
    request:
      method: DELETE
      url: "{{base_url}}/mapi/cs/issue/base/{{multi_wo_id}}"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert:                              # 🟢 接口层：删除被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ⏳待首跑回填
    db_check:
      - table: t_cs_issue
        sql: "SELECT deleted_at FROM t_cs_issue WHERE id=<multi_wo_id>;"
        expect: "deleted_at != 0（软删）"
        reason: "工单清理软删生效"

  - id: multi_cleanup_tpl
    desc: '[MULTI] 清理模板'
    skip_note: "🔴依赖 multi_cfg_id"
    request:
      method: DELETE
      url: "{{base_url}}/mapi/cs/issue/config/{{multi_cfg_id}}"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert:                              # 🟢 接口层：删除被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ⏳待首跑回填
    db_check:
      - table: t_cs_issue_config
        sql: "SELECT deleted_at FROM t_cs_issue_config WHERE id=<multi_cfg_id>;"
        expect: "deleted_at != 0（软删）"
        reason: "模板清理软删生效"

  # ============================================================
  # 路径三：品牌授权 IsWriteQualification=1
  #   建品牌模板(isWriteQualification=1) → 建品牌工单 → 审批完结 → 触发 batchAuthorizeBrand
  #   覆盖 save:141/528 品牌授权分支（现有 brand 用例 IsWriteQualification=0 从不进入）
  # ============================================================
  - id: brand_auth_tpl_save
    desc: '[品牌授权] 建品牌保护模板 isWriteQualification=1'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueConfigName: "{{tpl_name_brand}}"
        issueConfigDesc: "品牌授权"
        subIssueType: "BRAND_PROTECTION"
        primaryKeyConfig: [{ name: "sellerId" }, { name: "merchantId" }, { name: "merchantName" }]
        nameListConfig: [{ primaryKeyField: "merchantName" }]
        approvalConfigs: [{ approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }], operateAreaList: ["ID"], carbonList: ["liyanda@shoplineapp.com"] }]
        isWriteQualification: 1
        isAppointMonth: 0
    assert:                              # 🟢 接口层：建品牌模板被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
    db_check:                            # 🟡 模板真伪（isWriteQualification 列名未核实→不写该列断言，只验行存在）
      - table: t_cs_issue_config
        sql: "SELECT id, deleted_at FROM t_cs_issue_config WHERE issue_config_name='[FLOW]brand模板<run_id>';"
        expect: "1 行有效模板(deleted_at=0)。⏳ isWriteQualification 是否真=1 的列名未核实，需查 t_cs_issue_config 结构后补断言"
        reason: "品牌授权模板真的建库；写资质开关是否落库待补"

  - id: brand_auth_tpl_find
    desc: '[品牌授权] 查回 configId'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/list"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { pageNum: 1, pageSize: 5, issueConfigName: "{{tpl_name_brand}}" }
    extract: { brand_cfg_id: "$.data.list[0].issueConfigId" }
    assert:                              # 🟢 查回模板命中
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }                     # ✅实跑确认
        - { path: "$.data.list[0].issueConfigId", exists: true }    # ✅

  - id: brand_auth_wo_save
    desc: '[品牌授权] 建品牌工单（真实主键 + 品牌字段/有效期）'
    skip_note: "🔴品牌字段 brandType/品牌名/有效期需真实值；主键用真实商家池 li0106@123.com"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "ADD"
        issueName: "[FLOW]brandauth{{run_id}}"
        issueConfigId: "{{brand_cfg_id}}"
        approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }]
        carbonList: ["liyanda@shoplineapp.com"]
        primaryKeyConfig:
