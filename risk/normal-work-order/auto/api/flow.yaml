name: risk-normal-work-order-crud
desc: 风控普通工单模块全链路（创建→详情→列表→编辑→审批→删除）。基于「其他」类型+店铺Handle模板(configId=21)绕过名单主键搜索。

# =====================================================================
# 断言规范（两段式 · 靠 key 的存在天然分桶，runner 无需改）
#   assert:     🟢机器判定段——runner 唯一评分依据。只放"接口层能判死"的：
#               status / $.code / 子串 contains / exists。
#               equals/contains 期望值支持 {{var}}（2026-08-15 C 起，runner 用本轮 ctx 渲染
#               后再比对；未定义变量原样保留，失败输出可见漏配）。
#   db_check:   🟡DB兜底段——runner 忽略，永不自动通过。接口返回 SUCCESS≠数据对，
#               真伪由这里的 SQL 人工确认（真表名/真列名，见 <repo>/model/cs/...）。
#               每条：table + sql + expect + reason；<run_id>/<issue_id> 用执行输出替换。
#   skip_note:  🔴人工段——runner 跑不了，见 cases/手动覆盖清单.md。
# 期望值出处标记：✅实跑确认(可锁死) / ⏳待首跑回填(仅代码推断，勿当已验证)
# =====================================================================

base_url: https://test-risk.inshopline.com

variables:
  cookie: "{{ENV:RISK_COOKIE}}"          # 整段 Cookie（riskSessionId+armorSession+…），执行时 --set 或环境变量注入
  issue_config_id: "21"                  # 模板「测试工单类型-一级审批」(其他类型)
  approval_user_id: "253"                # 1级审批人 liyanda
  carbon_email: "liyanda@shoplineapp.com"
  # run_id 由执行器自动注入（时间戳），用于新建实体名唯一

steps:
  # ---------- 1. 枚举（可选，拿状态/类型码） ----------
  - id: enums
    desc: 取工单状态/类型/主键枚举
    request:
      method: GET
      url: "{{base_url}}/mapi/cs/issue/base/enums"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert:
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }       # ✅实跑确认
        - { path: "$.data", exists: true }             # ✅ 枚举字典非空
        - { path: "$.data.issueConfigSubTypeList", exists: true }   # ✅实跑确认 子类型枚举在
        - { path: "$.data.normalIssueStatusList", exists: true }    # ✅实跑确认 状态枚举在

  # ---------- 2. 创建工单 ----------
  - id: create
    desc: 列表页「新建工单」→选其他类型+模板(configId=21)→填表→「完成」提交
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "ADD"
        issueName: "[FLOW]{{run_id}}"
        applyDesc: "api-flow-recorder 自动化创建，可删"
        issueConfigId: "{{issue_config_id}}"
        approvalConfig:
          - { step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }
        carbonList:
          - "{{carbon_email}}"
        materialsConfig:
          - { fieldName: "证明材料修改后", fieldValue: "无" }
        primaryKeyConfig:
          - { fieldName: "storeHandle", fieldInputType: "TEXT", fieldValue: ["flow-handle-{{run_id}}"] }
    extract:
      issue_id: "$.data"                 # 新建返回的 issueId
    assert:                              # 🟢 接口层：建单请求被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
        - { path: "$.data", exists: true }             # ✅ 返回了 issueId
    db_check:                            # 🟡 数据层真伪（接口 SUCCESS 不代表真落库，缺陷1 教训）
      - table: t_cs_issue
        sql: "SELECT issue_status, sub_issue_type, deleted_at FROM t_cs_issue WHERE id=<issue_id>;"
        expect: "1 行；issue_status=1(待审批)；sub_issue_type=OTHER；deleted_at=0"
        reason: "工单主表真的建了一条待审批工单"
      - table: t_cs_issue_field_value
        sql: "SELECT field_value FROM t_cs_issue_field_value WHERE issue_id=<issue_id> AND field_type='PRIMARY' AND field_name='storeHandle' AND deleted_at=0;"
        expect: "field_value = 'flow-handle-<run_id>'（非空！）"
        reason: "缺陷1: 空主键会被静默存成 '' 而非报错。此处入参非空，必须回读到真值，否则=主键丢失脏单"

  # ---------- 3. 查看详情 ----------
  - id: detail
    desc: 列表行「查看」→进入工单详情
    request:
      method: GET
      url: "{{base_url}}/mapi/cs/issue/normal/{{issue_id}}"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    extract:
      issue_id: "$.data.issueId"        # 覆盖为字符串类型（edit/approve 的 issueId 后端要 string）
    assert:                              # 🟢 详情回读——验证刚建的单能查出且是"我们建的那条"
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }            # ✅实跑确认
        - { path: "$.data.issueId", exists: true }         # ✅
        - { path: "$.data.issueName", contains: "[FLOW]" } # ✅ 回读名称=我们建的（前缀静态可判）
        - { path: "$.data.approvalConfig", exists: true }  # ✅实跑确认 审批链回读在
        - { path: "$.data.canApproval", exists: true }     # ✅实跑确认 审批权字段在
        - { path: "$.data.issueStatus", exists: true }     # ✅实跑确认+独立probe(2026-08-15)：字段在，字符串枚举

  # ---------- 4. 列表查询（按名称过滤刚建的） ----------
  - id: list
    desc: 列表页「查询」，过滤刚创建的工单
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/list"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        listType: "NAMELIST_APPLY"
        issueName: "[FLOW]{{run_id}}"
        pageNum: 1
        pageSize: 10
    assert:                              # 🟢 过滤查询命中——列表能按名字查回刚建的单
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }                # ✅实跑确认
        - { path: "$.data.list[0].issueId", exists: true }     # ✅实跑确认 分页字段路径 data.list[]
        - { path: "$.data.list[0].issueName", contains: "[FLOW]" }
        - { path: "$.data.list[0].creatorName", exists: true } # ✅实跑确认
        - { path: "$.data.list[0].issueConfigId", exists: true } # ✅实跑确认
        - { path: "$.data.list[0].issueId", equals: "{{issue_id}}" } # ✅C后可用：锁"查回的就是刚建那条"（首跑待确认）

  # ---------- 5. 编辑（改抄送名单） ----------
  - id: edit
    desc: 详情页「编辑」→改抄送人邮箱→「确定」
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/edit"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueId: "{{issue_id}}"
        carbonList: "edited-{{run_id}}@shoplineapp.com"
    assert:                              # 🟢 接口层：编辑被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
        - { path: "$.data", equals: true }             # ✅实跑确认 受理返回 data=true
    db_check:                            # 🟡 编辑真伪：SUCCESS 不代表真改了库
      - table: t_cs_issue
        sql: "SELECT carbon_list, deleted_at FROM t_cs_issue WHERE id=<issue_id>;"
        expect: "carbon_list 含 'edited-<run_id>@shoplineapp.com'（旧的 liyanda@ 被替换）；deleted_at 仍=0"
        reason: "编辑抄送人是否真落库；顺带验编辑不误改软删列"

  # ---------- 5.5 编辑回读（B：静态标记断言，接口层验证编辑真生效） ----------
  - id: edit_verify
    desc: 编辑后再查详情——接口层回读验证抄送人真的换了（DB 真伪仍归 db_check）
    request:
      method: GET
      url: "{{base_url}}/mapi/cs/issue/normal/{{issue_id}}"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert:
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }              # ✅实跑确认
        - { path: "$.data.carbonList", exists: true }        # ✅实跑确认 回显为数组
        - { path: "$.data.carbonList", contains: "edited-{{run_id}}" } # ✅实跑确认（C能力）造数标记+本轮run_id双重锁

  # ---------- 6. 审批通过 ----------
  - id: approve
    desc: 详情页「通过」（当前审批人=自己时）→审批通过，状态→已完结
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/approve"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueId: "{{issue_id}}"
        approveDesc: "自动化审批通过"
        approveStatus: "SUCCESS"          # 驳回用 REJECT（已实跑验证：状态→已驳回）
    assert:                              # 🟢 接口层：审批被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
        - { path: "$.data", equals: true }             # ✅实跑确认 受理返回 data=true
    db_check:                            # 🟡 审批真伪：SUCCESS 不代表状态真流转（第2档）
      - table: t_cs_issue
        sql: "SELECT issue_status, current_approve_step_status FROM t_cs_issue WHERE id=<issue_id>;"
        expect: "issue_status=3(已完结)；current_approve_step_status='SUCCESS'（⚠️2026-08-15 API回显issueStatus='4'，DB枚举与回显码的映射以人工核对为准）"
        reason: "单级 SINGLE 审批通过后工单是否真的流转到已完结"
      - table: t_cs_issue_log
        sql: "SELECT COUNT(*) FROM t_cs_issue_log WHERE issue_id=<issue_id>;"
        expect: ">=1 条审批流水"
        reason: "审批动作是否真写了操作日志（有 log 表可查则验，无则删本条）"

  # ---------- 6.5 审批后回读（B：状态流转的接口层验证） ----------
  - id: approve_verify
    desc: 审批通过后再查详情——接口层验证工单状态真流转（DB 真伪仍归 db_check）
    request:
      method: GET
      url: "{{base_url}}/mapi/cs/issue/normal/{{issue_id}}"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert:
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }            # ✅实跑确认
        - { path: "$.data.issueStatus", exists: true }     # ✅实跑确认 字段路径
        - { path: "$.data.issueStatus", equals: "4" }      # ✅实跑确认+独立probe(2026-08-15)：单级审批通过后回显"4"（已完结）。⚠️与db_check的issue_status=3映射差异留给DB人工核对

  # ---------- 7. 删除 ----------
  - id: delete
    desc: 列表行「删除」→二次确认「确定要删除吗？」→删除
    request:
      method: DELETE
      url: "{{base_url}}/mapi/cs/issue/base/{{issue_id}}"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert:                              # 🟢 接口层：删除被受理
      status: 200
      json:
        - { path: "$.code", equals: "SUCCESS" }        # ✅实跑确认
    db_check:                            # 🟡 删除真伪：软删还是物删？
      - table: t_cs_issue
        sql: "SELECT deleted_at FROM t_cs_issue WHERE id=<issue_id>;"
        expect: "deleted_at != 0（软删，行仍在只是标了删除时间戳；非物理删除）"
        reason: "确认删除=软删且真生效；若行消失=物删、若 deleted_at 仍=0=没删掉"
