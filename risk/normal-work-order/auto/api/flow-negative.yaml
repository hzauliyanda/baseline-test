  - id: neg_cfg_delete_ok
    desc: '前置：删掉种子模板（为"编辑已删/重复删"铺垫）'
    request:
      method: DELETE
      url: "{{base_url}}/mapi/cs/issue/config/{{neg_cfg_id}}"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }   # ✅实跑确认
    db_check:                            # 🟡 删模板真伪：软删而非物删（也是下游 edit_deleted/delete_again 的前提）
      - table: t_cs_issue_config
        sql: "SELECT deleted_at FROM t_cs_issue_config WHERE id=<neg_cfg_id>;"
        expect: "deleted_at != 0（软删生效，行仍在）"
        reason: "确认模板删除=软删；若行消失=物删、若仍=0=没删掉，都会让后续 edit_deleted/delete_again 语义失真"

