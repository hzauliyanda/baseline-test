name: risk-normal-work-order-negative
desc: >
  普通工单模块【负向/边界全量补充】——覆盖 master 代码里"入参为空/必填缺失/id非数字/id不存在/
  枚举非法值/状态门/模板校验链"等 happy-path 之外的守卫分支。对照《接口用例-代码分支覆盖审计-2026-08-02.md》。
  约定：负向多为 HTTP 200 包体带错误码，故 assert 只锁 status=200，期望错误码写在 desc/注释里，
  首次实跑后按真实 $.code / $.message 回填精确断言（与基线既有做法一致）。
  带 skip_note 的步骤 runner 无法自动化，见 cases/手动覆盖清单.md。

# =====================================================================
# 断言规范（两段式 · 与 flow.yaml 同一套 · 靠 key 的存在天然分桶）
#   assert:    🟢机器判定段——runner 唯一评分依据。负向多为 HTTP200 包体带错误码。
#   db_check:  🟡DB兜底段——runner 忽略，永不自动通过。仅"接口成功却改了库"的
#              副作用类负向才有（如空主键静默落库、缺必填仍建成）。真表名见 <repo>/model/cs/。
#   skip_note: 🔴人工段——runner 跑不了（越权需二号账号 / multipart / 并发 / 需注入id）。
# 期望值出处（本文件通用约定，不逐行重复标）：
#   ✅实跑确认 = assert 含 json 断言 且 无 skip_note 的步骤，期望码/串是首跑真实回填、可锁死。
#   ⏳待回填   = 仅 status:200 的、或带 skip_note 的步骤，期望码只在注释里，属"读代码推断"，
#              未实跑确认，绝不升级成硬 equals；首次实跑后再回填。
#   已知"故意红"缺口用例（断言期望被拒、实际却 SUCCESS，用于持续暴露）单独在该步注明。
# =====================================================================
base_url: https://test-risk.inshopline.com

variables:
  cookie: "{{ENV:RISK_COOKIE}}"                 # 运营账号 cookie
  normal_user_cookie: "{{ENV:RISK_NORMAL_COOKIE}}"  # 普通用户账号 cookie（越权/无权限用例需要，未配则相关步骤 skip）
  issue_config_id: "21"                         # 有效普通模板（其他类型，一级审批）
  punish_config_id: ""                          # 处罚类模板 id（删处罚模板/传处罚模板负向需要，未知则 skip）
  approval_user_id: "253"                        # liyanda
  other_issue_id: ""                            # 他人创建的工单 id（越权用例需要，--set 注入）
  self_pending_issue_id: ""                      # 自有"待审批"工单 id（approve/edit 空值门需要，--set 注入）
  tpl_name: "[FLOW]neg模板{{run_id}}"

steps:

  # ============================================================
  # A. 工单审批 approve —— 入参为空 / 省略 / 状态门
  # ============================================================
  - id: neg_approve_empty_issueid
    desc: '空值：issueId="" → 期望 PARAMETER_EXCEPTION (save:64)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/approve"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "", approveStatus: "SUCCESS", approveDesc: "空issueId" }
    assert:
      status: 200
      json: [{ path: "$.code", equals: "INVALID_ARGUMENT" }]   # 已拒绝（消息通用"系统异常"）

  - id: neg_approve_omit_issueid
    desc: '省略 issueId 字段（approve 无 binding，ParseInt("")失败）→ 期望 参数异常 (issue_controller:96)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/approve"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { approveStatus: "SUCCESS", approveDesc: "无issueId" }
    assert:
      status: 200
      json: [{ path: "$.code", equals: "INVALID_ARGUMENT" }]

  - id: neg_approve_empty_status
    desc: '空值：approveStatus="" → 期望 PARAMETER_EXCEPTION (save:64)。需自有待审工单'
    skip_note: "需 --set self_pending_issue_id=<自有待审批工单id>"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/approve"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{self_pending_issue_id}}", approveStatus: "", approveDesc: "空status" }
    assert: { status: 200 }   # ⏳待回填(skip未跑,代码推断) 期望 $.code=PARAMETER_EXCEPTION (save:64)

  - id: neg_approve_finished_again
    desc: '状态门：对已完结/已驳回工单再审批（当前步无待审记录）→ 期望 APPROVE_END (save:319)'
    skip_note: "需 --set self_pending_issue_id=<一个已完结工单id>"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/approve"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "{{self_pending_issue_id}}", approveStatus: "SUCCESS", approveDesc: "重复审批" }
    assert: { status: 200 }   # ⏳待回填(skip未跑,代码推断) 期望 $.code=APPROVE_END 或 ISSUE_CANNOT_APPROVED (save:319)

  # ============================================================
  # B. 工单编辑 edit —— 入参为空 / 不存在 / 非数字
  # ============================================================
  - id: neg_edit_empty_issueid
    desc: '空值：edit issueId="" → 期望 PARAMETER_EXCEPTION (save:1692)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/edit"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "", carbonList: "x@shoplineapp.com" }
    assert:
      status: 200
      json: [{ path: "$.message", contains: "参数异常" }]

  - id: neg_edit_notfound
    desc: '不存在：edit issueId=999999999 → 期望 PARAMETER_EXCEPTION（工单不存在 save:1700）'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/edit"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "999999999", carbonList: "x@shoplineapp.com" }
    assert:
      status: 200
      json: [{ path: "$.message", contains: "获取信息异常" }]

  - id: neg_edit_nonnumeric_id
    desc: '非数字：edit issueId="abc" → 期望 工单配置id异常 (issue_controller:228)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/edit"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { issueId: "abc", carbonList: "x@shoplineapp.com" }
    assert:
      status: 200
      json: [{ path: "$.code", equals: "INVALID_ARGUMENT" }]

  - id: neg_save_empty_approvallist
    desc: '空值：approvalList=[] 审批人列表为空 → 期望 APPROVAL_CANNOT_BE_NULL (save:1524)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "ADD"
        issueName: "[FLOW]negA{{run_id}}"
        applyDesc: "审批人空负向"
        issueConfigId: "{{issue_config_id}}"
        approvalConfig:
          - { step: 1, type: "SINGLE", approvalList: [] }
        carbonList: ["liyanda@shoplineapp.com"]
        primaryKeyConfig:
          - { fieldName: "storeHandle", fieldInputType: "TEXT", fieldValue: ["neg-{{run_id}}"] }
    assert:
      status: 200
      json: [{ path: "$.code", equals: "INVALID_ARGUMENT" }]   # 空审批人已拒绝；但消息通用"系统异常"而非"审批人不能为空"（消息不友好，建议优化）

  - id: neg_save_bad_configid
    desc: '非法：issueConfigId="0" 查不到模板 → 期望 GET_DETAIL_ERROR (save:168)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "ADD"
        issueName: "[FLOW]negB{{run_id}}"
        issueConfigId: "0"
        approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }]
        carbonList: ["liyanda@shoplineapp.com"]
        primaryKeyConfig: [{ fieldName: "storeHandle", fieldInputType: "TEXT", fieldValue: ["x"] }]
    assert:
      status: 200
      json: [{ path: "$.message", contains: "获取信息异常" }]

  - id: neg_save_nonnumeric_configid
    desc: '非数字：issueConfigId="abc" → 期望 工单配置id异常 (issue_controller:164)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "ADD"
        issueName: "[FLOW]negC{{run_id}}"
        issueConfigId: "abc"
        approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }]
        carbonList: ["liyanda@shoplineapp.com"]
    assert:
      status: 200
      json: [{ path: "$.code", equals: "INVALID_ARGUMENT" }]

  - id: neg_save_punish_template
    desc: '类型门：传处罚(PUNISH)模板到 normal/save → 期望 PARAMETER_EXCEPTION (save:172)'
    skip_note: "需 --set punish_config_id=<一个处罚类模板id>（可从处罚工单模块模板列表取）"
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "ADD"
        issueName: "[FLOW]negD{{run_id}}"
        issueConfigId: "{{punish_config_id}}"
        approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }]
        carbonList: ["liyanda@shoplineapp.com"]
    assert: { status: 200 }   # ⏳待回填(skip未跑,代码推断) 期望 $.code=PARAMETER_EXCEPTION (save:172 非普通模板)

  - id: neg_save_primary_empty_silent
    desc: '校验缺口：主键 fieldValue=[""] 空值 → 建单 SUCCESS 且主键以空值落库（DB 已证实 fieldValue.value=""），无非空校验。addFieldArr:920 的空值守卫对数组[""]未拦住'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        submitType: "ADD"
        issueName: "[FLOW]negE{{run_id}}"
        issueConfigId: "{{issue_config_id}}"
        approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["{{approval_user_id}}"] }]
        carbonList: ["liyanda@shoplineapp.com"]
        primaryKeyConfig: [{ fieldName: "storeHandle", fieldInputType: "TEXT", fieldValue: [""] }]
    extract: { neg_e_id: "$.data" }
    assert:
      status: 200
      json: [{ path: "$.code", equals: "INVALID_ARGUMENT" }]   # ★故意红缺口：期望"拒绝"，实际却 SUCCESS(空主键静默落库)。持续 FAIL 以暴露，修复后转绿。✅实跑确认(现状=SUCCESS)
    db_check:                            # 🟡 证实缺口的数据副作用：空主键真被写进库
      - table: t_cs_issue_field_value
        sql: "SELECT field_value FROM t_cs_issue_field_value WHERE issue_id=<neg_e_id> AND field_type='PRIMARY' AND field_name='storeHandle' AND deleted_at=0;"
        expect: "存在 1 行且 field_value='' (空串)——即空主键被静默落库(你查到的 7772 行现象)。修复后应查不到此脏行"
        reason: "把'接口SUCCESS'升级为'DB证实脏数据'，缺陷1 的硬证据"

  - id: neg_detail_notfound
    desc: '不存在：GET /normal/999999999 → 期望 INVALID_TICKET_ID (query:70)'
    request:
      method: GET
      url: "{{base_url}}/mapi/cs/issue/normal/999999999"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert:
      status: 200
      json: [{ path: "$.message", contains: "获取信息异常" }]

  - id: neg_detail_zero
    desc: '空值：GET /normal/0 → 期望 参数异常 (query:62)'
    request:
      method: GET
      url: "{{base_url}}/mapi/cs/issue/normal/0"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert:
      status: 200
      json: [{ path: "$.message", contains: "参数异常" }]

  - id: neg_detail_nonnumeric
    desc: '非数字：GET /normal/abc → 期望 SystemErr/参数异常 (issue_controller:59)'
    request:
      method: GET
      url: "{{base_url}}/mapi/cs/issue/normal/abc"
      headers: { appId: "4", version: "v2", Cookie: "{{cookie}}" }
    assert:
      status: 200
      json: [{ path: "$.code", equals: "INVALID_ARGUMENT" }]

  - id: neg_list_page_overflow
    desc: '越界：pageNum=99999 → 期望空 list（query:40）'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/list"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { listType: "NAMELIST_APPLY", pageNum: 99999, pageSize: 10 }
    assert:
      status: 200
      json: [{ path: "$.code", equals: "SUCCESS" }]

  - id: neg_list_pagesize_zero
    desc: '边界：pageSize=0（注意 (pageNum-1)*pageSize 除零/空结果风险）'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/list"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { listType: "NAMELIST_APPLY", pageNum: 1, pageSize: 0 }
    assert:
      status: 200
      json: [{ path: "$.code", equals: "SUCCESS" }]   # pageSize=0 未报错，返回 SUCCESS（行为登记）

  - id: neg_list_brandprotect
    desc: 'listType 覆盖：BRAND_PROTECT 品牌保护列表分支（query:713 IsBrandList=true）'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/normal/list"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { listType: "BRAND_PROTECT", pageNum: 1, pageSize: 10 }
    assert:
      status: 200
      json: [{ path: "$.code", equals: "SUCCESS" }]

  - id: neg_cfg_miss_name
    desc: '必填缺失：省略 issueConfigName → 期望 binding 校验失败 (issue_config_vo:54)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueConfigDesc: "缺name"
        subIssueType: "OTHER"
        approvalConfigs: [{ approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["253"] }], operateAreaList: ["ID"], carbonList: ["liyanda@shoplineapp.com"] }]
    assert:
      status: 200
      json: [{ path: "$.message", contains: "IssueConfigName" }]   # gin binding required 生效

  - id: neg_cfg_miss_desc
    desc: '必填缺失：省略 issueConfigDesc (issue_config_vo:55)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueConfigName: "[FLOW]negcfg{{run_id}}"
        subIssueType: "OTHER"
        approvalConfigs: [{ approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["253"] }], operateAreaList: ["ID"], carbonList: ["liyanda@shoplineapp.com"] }]
    assert:
      status: 200
      json: [{ path: "$.message", contains: "IssueConfigDesc" }]

  - id: neg_cfg_miss_subtype
    desc: '必填缺失：省略 subIssueType (issue_config_vo:56)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueConfigName: "[FLOW]negcfg{{run_id}}"
        issueConfigDesc: "缺subtype"
        approvalConfigs: [{ approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["253"] }], operateAreaList: ["ID"], carbonList: ["liyanda@shoplineapp.com"] }]
    assert:
      status: 200
      json: [{ path: "$.message", contains: "SubIssueType" }]

  - id: neg_cfg_miss_approval
    desc: '必填缺失：省略 approvalConfigs (issue_config_vo:59)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueConfigName: "[FLOW]negcfg{{run_id}}"
        issueConfigDesc: "缺approval"
        subIssueType: "OTHER"
    assert:
      status: 200
      json: [{ path: "$.message", contains: "ApprovalConfigs" }]

  - id: neg_cfg_miss_carbon
    desc: '必填缺失：省略 carbonList（注释"抄送人不允许为空" issue_config_vo:61）'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueConfigName: "[FLOW]negcfg{{run_id}}"
        issueConfigDesc: "缺carbon"
        subIssueType: "OTHER"
        approvalConfigs: [{ approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["253"] }], operateAreaList: ["ID"] }]
    assert:
      status: 200
      json: [{ path: "$.message", contains: "required" }]   # ★故意红契约缺口：vo 注释称 carbonList 必填，实际却 SUCCESS 建成——binding 未生效。持续 FAIL 以暴露。✅实跑确认(现状=SUCCESS)
    db_check:                            # 🟡 证实缺口：缺 carbon 的模板真被建出来了(本名仅本步会成功,其余 miss_* 都被 binding 挡下)
      - table: t_cs_issue_config
        sql: "SELECT id, issue_config_name FROM t_cs_issue_config WHERE issue_config_name='[FLOW]negcfg<run_id>' AND deleted_at=0;"
        expect: "存在 1 行——即缺 carbonList 仍建成模板。修复 binding 后应查不到"
        reason: "把'接口SUCCESS'升级为'DB证实必填未拦'，暴露 carbonList binding 契约缺口"

  - id: neg_cfg_namelist_primary
    desc: '校验链：名单类模板主键字段不在 primaryKeyConfig 中 → 期望 NAMELIST_CONFIG_MUST_PRIMARY (config_svc:284)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueConfigName: "[FLOW]negNL{{run_id}}"
        issueConfigDesc: "名单主键错配"
        subIssueType: "NAME_LIST_APPLY"
        primaryKeyConfig: [{ name: "storeHandle" }]     # 名单库主键要 merchantId，这里故意只给 storeHandle
        nameListConfig: [{ primaryKeyField: "merchantId" }]
        approvalConfigs: [{ approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["253"] }], operateAreaList: ["ID"], carbonList: ["liyanda@shoplineapp.com"] }]
    assert:
      status: 200
      json: [{ path: "$.message", contains: "名单配置字段必须是主键字段" }]

  - id: neg_cfg_seed_create
    desc: '前置：建一个 OTHER 模板供"改名/已删/重复删/重名"负向复用'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueConfigName: "{{tpl_name}}"
        issueConfigDesc: "负向种子模板"
        subIssueType: "OTHER"
        primaryKeyConfig: [{ name: "storeHandle" }]
        approvalConfigs: [{ approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["253"] }], operateAreaList: ["ID"], carbonList: ["liyanda@shoplineapp.com"] }]
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: neg_cfg_find_id
    desc: '前置：list 查回 configId'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/list"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json: { pageNum: 1, pageSize: 5, issueConfigName: "{{tpl_name}}" }
    extract: { neg_cfg_id: "$.data.list[0].issueConfigId" }
    assert: { status: 200, json: [{ path: "$.code", equals: "SUCCESS" }] }

  - id: neg_cfg_name_exist
    desc: '重名：用已存在名称不带 id 再建 → 期望 TEMPLATE_NAME_EXIST (config_svc:182)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
        issueConfigName: "{{tpl_name}}"
        issueConfigDesc: "重名"
        subIssueType: "OTHER"
        primaryKeyConfig: [{ name: "storeHandle" }]
        approvalConfigs: [{ approvalConfig: [{ step: 1, type: "SINGLE", approvalList: ["253"] }], operateAreaList: ["ID"], carbonList: ["liyanda@shoplineapp.com"] }]
    assert:
      status: 200
      json: [{ path: "$.message", contains: "模板配置名称已存在" }]

  - id: neg_cfg_name_modify
    desc: '名称不可改：带 configId 但改新名 → 期望 TEMPLATE_NAME_CAN_NOT_MODIFY (config_svc:210)'
    request:
      method: POST
      url: "{{base_url}}/mapi/cs/issue/config/save"
      headers: { appId: "4", version: "v2", Content-Type: "application/json", Cookie: "{{cookie}}" }
      json:
