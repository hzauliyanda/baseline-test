# ============================================================
# api-flows 配置模板 —— 复制为 config.yaml 后填自己的值
#   cp config.example.yaml config.yaml   然后改下面各项
#   敏感值(token)建议改用环境变量：export OCTOPUSES_TOKEN=xxx
# ============================================================
root: auto                    # auto=本文件所在目录；也可写绝对路径

chrome:
  binary: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"  # macOS；Linux/Win 改此路径
  port: 9333
  profile: ".chrome-profile"

systems:                      # 每个被测系统一段
  <你的系统名>:               # 如 risk / slop
    base_url: "https://test-<你的系统>.example.com"
    headers: { appId: "<租户appId>", version: "v2" }
    cookie_env: "<系统>_COOKIE"        # 执行时 export 该环境变量
    mark_prefix: "[FLOW]"

octopuses:                    # 若不用 octopuses 平台可整段删掉
  endpoint: "https://<你的测试平台>/api/autotest/cases/case"
  token_env: "OCTOPUSES_TOKEN"
  token: ""                   # 留空则必须走环境变量
  space_id: ""
  group_id: 0
  pid: ""
  creator: 0
  move_target_dir: ""
  move_start_id: 0

uploads:                      # 要上传/移动的 flow（label + 相对 root 路径）
  - { label: "<模块中文名>", flow: "<系统>/<模块>/auto/api/flow.yaml" }
